<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>학습실 관리자 · MAKE TOEIC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#172844;--orange:#FF581F;--bg:#F5F7FA;--line:#E3E7EF;--text:#1F2937;--ok:#1E8E5A;--bad:#D2453B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(125deg,#14233E,#233C5C);color:#fff;border:0}
.hero h1{margin:2px 0 0;font-size:22px;color:#fff}
.kicker{font-size:12px;font-weight:800;letter-spacing:2px;color:#FF8A5C}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;background:var(--orange);color:#fff;cursor:pointer}
.btn.navy{background:var(--navy)}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}.btn.red{background:#fff;border:1.5px solid var(--bad);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tabs button.t{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;color:var(--navy)}
.tabs button.t.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px}
label{display:block;font-size:14px;font-weight:800;color:var(--navy);margin:10px 0 4px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat div{background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:700;color:var(--navy)}
.stat b{display:block;font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:800;cursor:pointer;color:var(--navy)}
.chips button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.st{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;background:#fff}
.st .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.st .nm{font-size:18px;font-weight:800;color:var(--navy)}
.st .info{font-size:14px;color:var(--text);margin-top:3px}
.st .prog{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st .prog span{background:var(--bg);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700;color:var(--navy)}
.st .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12.5px;font-weight:800;white-space:nowrap}
.tag.ok{background:#E3F4EB;color:var(--ok)}.tag.soon{background:#FFEDE3;color:#D9480F}.tag.end{background:#FBE7E5;color:var(--bad)}
.tag.lc{background:#E6EEFF;color:#2952CC}.tag.full{background:#FFF1D6;color:#8A5300}
.msg{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;font-weight:700}.msg.err{background:#FBE7E5;color:var(--bad)}.msg.ok{background:#E3F4EB;color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(23,40,68,.55);display:flex;align-items:flex-end;justify-content:center;z-index:99;padding:0}
.modal .card{width:100%;max-width:640px;max-height:92vh;overflow:auto;margin:0;border-radius:18px 18px 0 0}
@media(min-width:700px){.modal{align-items:center;padding:16px}.modal .card{border-radius:18px}}
.modal h2{margin:0 0 4px;font-size:20px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
th{background:var(--bg);font-size:13px;color:var(--navy)}
.bar{height:8px;background:#E9EDF3;border-radius:99px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--orange)}
.days{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px}
.days div{flex:1;background:var(--orange);border-radius:3px 3px 0 0;min-height:2px}
.days div.z{background:#E3E7EF}
.dlab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--navy);margin-top:4px}
.grp{font-size:15px;font-weight:800;color:var(--navy);margin:14px 0 6px}
.sec{font-size:15px;font-weight:800;color:var(--navy);margin:0 0 8px}
.note{font-size:14px;color:var(--text)}
.rec{display:grid;grid-template-columns:1fr;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
@media(min-width:700px){.rec{grid-template-columns:130px 1.2fr 2fr 90px 40px;align-items:center}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">불러오는 중…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/study/onote-core.js?v=3"></script>
<script>
(function () {
"use strict";
var U = "https://hrlldteviatcatxyzrrz.supabase.co", K = "sb_publishable_YT1A99HvH7VoMz76xq7Tvg__Imr0_qy";
var sb, app = document.getElementById("app"), students = [], q = "", fil = "on", view = "list";

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function render(h) { app.innerHTML = h; }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function today(off) { var d = new Date(); d.setDate(d.getDate() + (off || 0)); return ymd(d); }
function monthEnd(from) { var p = from.split("-"); return ymd(new Date(+p[0], +p[1], 0)); }
function md(s) { if (!s) return ""; var d = new Date(s); return (d.getMonth() + 1) + "/" + d.getDate(); }
function ago(s) {
  if (!s) return "없음";
  var d = Math.floor((Date.now() - new Date(s).getTime()) / 86400000);
  return d <= 0 ? "오늘" : d === 1 ? "어제" : d + "일 전";
}
function serForMonth(y, m) { var k = ((y - 2026) * 12 + m - 10) % 3; k = (k + 3) % 3; return [3, 2, 1][k]; }
// 학습실과 같은 규칙: 등록 기간에 걸친 달마다 그 달의 Season이 열림 (2026년 10월부터, 이번 달까지)
function seasonsOf(start, end, upToNow) {
  var st = String(start || "").split("-"), en = String(end || "").split("-"), out = [];
  if (st.length < 2 || en.length < 2) return out;
  var y = +st[0], m = +st[1], ey = +en[0], em = +en[1], now = new Date();
  if (y * 12 + m < 2026 * 12 + 10) { y = 2026; m = 10; }
  if (upToNow && ey * 12 + em > now.getFullYear() * 12 + now.getMonth() + 1) { ey = now.getFullYear(); em = now.getMonth() + 1; }
  for (var i = 0; i < 36 && y * 12 + m <= ey * 12 + em; i++) { out.push([y, m, serForMonth(y, m)]); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function seaTag(s) {
  var ct = s.cats && s.cats.length ? ' <span class="tag soon">' + s.cats.map(function (k) { return { lcmock: "LC모의", lcp2: "LC유형", rcbook: "RC교재", agrade: "A급", voca: "VOCA" }[k]; }).join("·") + '</span>' : "";
  if (PLAN_NM[s.plan] && !(s.seasons && s.seasons.length)) return ct;
  if (s.seasons && s.seasons.length) return ct + " " + s.seasons.map(function (n) { return `<span class="tag" style="background:#FF581F;color:#fff">Season ${n}</span>`; }).join(" ") + ' <span class="tag soon">직접 지정</span>';
  var a = seasonsOf(s.start_date, s.end_date, true), u = [];
  a.forEach(function (x) { if (u.indexOf(x[2]) < 0) u.push(x[2]); });
  return (u.length ? u.sort().map(function (n) { return `<span class="tag ok" style="background:#1F3864;color:#fff">Season ${n}</span>`; }).join(" ") : "") + ct;
}
function seaPlan(start, end) {
  var a = seasonsOf(start, end, false);
  if (!a.length) return "";
  return "열리는 Season: " + a.map(function (x) { return x[1] + "월 → <b>Season " + x[2] + "</b>"; }).join(", ");
}
function rpc(fn, args) { return sb.rpc(fn, args || {}).then(function (r) { if (r.error) throw r.error; return r.data; }); }
function modal(html) { var m = document.createElement("div"); m.className = "modal"; m.innerHTML = '<div class="card">' + html + "</div>"; document.body.appendChild(m); m.addEventListener("click", function (e) { if (e.target === m) m.remove(); }); return m; }

/* ---------- 로그인 ---------- */
function viewLogin(msg) {
  render(`<div class="card hero"><span class="kicker">MAKE TOEIC · 학습실 관리자</span><h1>관리자 로그인</h1></div>
  <div class="card" style="max-width:460px">${msg || ""}
    <label>이메일</label><input class="in" id="ad-email" type="email" autocomplete="username" placeholder="js1432@naver.com">
    <label>비밀번호</label><input class="in" id="ad-pw" type="password" autocomplete="current-password">
    <button class="btn" id="ad-login" style="width:100%;margin-top:14px;padding:14px">로그인</button>
    <p class="note" style="margin:12px 0 0">예전 maketoeic.com 학습실 관리자와 같은 계정이에요.</p></div>`);
  function go() {
    sb.auth.signInWithPassword({ email: document.getElementById("ad-email").value.trim().toLowerCase(), password: document.getElementById("ad-pw").value }).then(function (r) {
      if (r.error) return viewLogin('<div class="msg err">' + (/invalid login/i.test(r.error.message) ? "이메일 또는 비밀번호가 맞지 않아요." : "로그인 실패: " + esc(r.error.message)) + "</div>");
      afterLogin();
    });
  }
  document.getElementById("ad-login").onclick = go;
  document.getElementById("ad-pw").onkeydown = function (e) { if (e.key === "Enter") go(); };
}
function afterLogin() {
  rpc("claim_admin").then(function (ok) {
    if (!ok) { sb.auth.signOut(); return viewLogin('<div class="msg err">이 계정은 관리자가 아닙니다.</div>'); }
    refresh();
  }).catch(function (e) { viewLogin('<div class="msg err">' + esc(e.message) + "</div>"); });
}
function pwForm() {
  var m = modal(`<h2>관리자 비밀번호 변경</h2>
    <label>새 비밀번호 (8자 이상)</label><input class="in" id="p-1" type="password" autocomplete="new-password">
    <label>새 비밀번호 확인</label><input class="in" id="p-2" type="password" autocomplete="new-password">
    <div id="p-msg"></div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="p-save">변경</button><button class="btn ghost" id="p-cancel">닫기</button></div>`);
  m.querySelector("#p-cancel").onclick = function () { m.remove(); };
  m.querySelector("#p-save").onclick = function () {
    var a = m.querySelector("#p-1").value, b = m.querySelector("#p-2").value, msg = m.querySelector("#p-msg");
    if (a.length < 8) { msg.innerHTML = '<div class="msg err">8자 이상으로 정해 주세요.</div>'; return; }
    if (a !== b) { msg.innerHTML = '<div class="msg err">두 칸이 서로 달라요.</div>'; return; }
    sb.auth.updateUser({ password: a }).then(function (r) {
      msg.innerHTML = r.error ? '<div class="msg err">' + esc(r.error.message) + "</div>" : '<div class="msg ok">변경했어요.</div>';
    });
  };
}

/* ---------- 상단 ---------- */
function head() {
  return `<div class="card hero"><span class="kicker">MAKE TOEIC · 학습실 관리자</span><h1>${view === "rec" ? "당일 수업 녹화" : view === "price" ? "상품 가격" : view === "log" ? "등록 · 결제 기록" : "수강생 관리"}</h1></div>
  <div class="tabs"><button class="t ${view === "list" ? "on" : ""}" data-v="list">수강생 · 진도</button><button class="t ${view === "rec" ? "on" : ""}" data-v="rec">당일 수업 녹화</button><button class="t ${view === "log" ? "on" : ""}" data-v="log">등록 · 결제 기록</button><button class="t ${view === "price" ? "on" : ""}" data-v="price">상품 가격</button>
  <span style="flex:1"></span><button class="btn ghost sm" id="ad-chpw">비밀번호</button><button class="btn ghost sm" id="ad-out">로그아웃</button></div>`;
}
function bindHead() {
  app.querySelectorAll("[data-v]").forEach(function (b) { b.onclick = function () { view = b.dataset.v; view === "rec" ? viewRecs() : view === "price" ? viewPrice() : view === "log" ? viewLog() : draw(); }; });
  document.getElementById("ad-out").onclick = function () { sb.auth.signOut().then(function () { viewLogin(); }); };
  document.getElementById("ad-chpw").onclick = pwForm;
}

/* ---------- 수강생 목록 ---------- */
function refresh() { return rpc("admin_list_students").then(function (d) { students = d || []; draw(); }).catch(function (e) { render('<div class="msg err">' + esc(e.message) + "</div>"); }); }
function stTag(s) { return s.days_left < 0 ? '<span class="tag end">만료</span>' : s.days_left <= 7 ? `<span class="tag soon">D-${s.days_left}</span>` : `<span class="tag ok">D-${s.days_left}</span>`; }
var CATS = [["lcmock", "LC 실전 모의고사 · 해설강의"], ["lcp2", "LC Part 2 유형별"], ["rcbook", "RC 교재 문제 · 실전 테스트"], ["agrade", "A급 과제 · 해설강의"], ["voca", "VOCA · 단어 게임"]];
var PLAN_CATS = { lc: ["lcmock"], rc: ["rcbook"], lcrc: ["lcmock", "rcbook"] };
var PLAN_NM = { lc: "LC 30일권", rc: "RC 30일권", lcrc: "LC+RC 30일권" };
function kindTag(s) { return (PLAN_NM[s.plan] ? '<span class="tag lc">' + PLAN_NM[s.plan] + '</span>' : '<span class="tag full">수강생</span>') + (PLAN_NM[s.plan] && s.member ? ' <span class="tag full">수업 들은 학생</span>' : ''); }
function draw() {
  if (view !== "list") return;
  var on = students.filter(function (s) { return s.days_left >= 0; });
  var soon = on.filter(function (s) { return s.days_left <= 7; }).length;
  var idle = on.filter(function (s) { return !s.week; }).length;
  var k = q.toLowerCase();
  var rows = students.filter(function (s) {
    if (fil === "on" && s.days_left < 0) return false;
    if (fil === "end" && s.days_left >= 0) return false;
    if (fil === "idle" && (s.days_left < 0 || s.week)) return false;
    if (fil === "lc" && !PLAN_NM[s.plan]) return false;
    return !k || (s.name + s.phone + (s.memo || "")).toLowerCase().indexOf(k) >= 0;
  });
  render(head() + `<div class="card"><div class="stat"><div><b>${on.length}</b>이용 중</div><div><b>${soon}</b>7일 내 만료</div><div><b>${idle}</b>이번 주 미학습</div><div><b>${students.length - on.length}</b>만료</div></div></div>
  <div class="card">
    <button class="btn" id="ad-add" style="width:100%;padding:14px;font-size:17px">+ 수강생 등록</button>
    <input class="in" id="ad-q" placeholder="이름 · 번호 · 메모 검색" value="${esc(q)}" style="margin-top:10px">
    <div class="chips">${[["on", "이용 중"], ["idle", "이번 주 미학습"], ["lc", "비회원 30일권"], ["end", "만료"], ["all", "전체"]].map(function (c) { return `<button data-f="${c[0]}" class="${fil === c[0] ? "on" : ""}">${c[1]}</button>`; }).join("")}</div>
    ${rows.map(function (s) {
      var rate = s.solved ? Math.round(s.correct / s.solved * 100) : 0;
      return `<div class="st"><div class="top"><div><span class="nm">${esc(s.name)}</span> ${kindTag(s)} ${seaTag(s)}<div class="info">${esc(s.phone)} · ${esc(s.start_date)} ~ ${esc(s.end_date)}</div>${s.memo ? `<div class="info">메모: ${esc(s.memo)}</div>` : ""}</div>${stTag(s)}</div>
        <div class="prog"><span>푼 문제 ${s.solved}</span><span>정답률 ${rate}%</span><span>최근 7일 ${s.week}문제</span><span>마지막 학습 ${ago(s.last_at)}</span><span>마지막 접속 ${ago(s.last_login)}</span></div>
        <div class="acts"><button class="btn navy sm" data-rep="${s.id}">진도 보기</button><button class="btn sm" data-ext="${s.id}">+1개월</button><button class="btn ghost sm" data-edit="${s.id}">수정</button></div></div>`;
    }).join("") || '<p class="note">해당하는 수강생이 없어요.</p>'}
  </div>`);
  bindHead();
  document.getElementById("ad-add").onclick = function () { editForm(null); };
  var qi = document.getElementById("ad-q");
  qi.oninput = function () { q = qi.value; var pos = qi.selectionStart; draw(); var n = document.getElementById("ad-q"); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll("[data-f]").forEach(function (b) { b.onclick = function () { fil = b.dataset.f; draw(); }; });
  function find(id) { return students.find(function (x) { return x.id === id; }); }
  app.querySelectorAll("[data-ext]").forEach(function (b) {
    b.onclick = function () {
      var s = find(b.dataset.ext);
      if (!confirm(s.name + " 님의 이용 기간을 1개월 늘릴까요?")) return;
      rpc("admin_extend", { p_id: s.id, p_months: 1 }).then(refresh).catch(function (e) { alert(e.message); });
    };
  });
  app.querySelectorAll("[data-edit]").forEach(function (b) { b.onclick = function () { editForm(find(b.dataset.edit)); }; });
  app.querySelectorAll("[data-rep]").forEach(function (b) { b.onclick = function () { report(find(b.dataset.rep)); }; });
}

/* ---------- 등록 / 수정 ---------- */
function editForm(s) {
  var isNew = !s;
  s = s || { name: "", phone: "", level: "기초", start_date: today(), end_date: monthEnd(today()), memo: "", plan: null };
  var m = modal(`<h2>${isNew ? "수강생 등록" : "수강생 수정"}</h2>
    <p class="note" style="margin:0">학생은 <b>이름 + 휴대폰 번호 뒤 4자리</b>로 학습실에 들어가요.</p>
    <label>이름</label><input class="in" id="f-name" value="${esc(s.name)}">
    <label>휴대폰 번호</label><input class="in" id="f-phone" inputmode="numeric" value="${esc(s.phone)}" placeholder="01012345678">
    <label>구분</label><select class="in" id="f-plan"><option value="">수강생 (학습실 전체: LC·RC·A급·VOCA)</option><option value="lc" ${s.plan === "lc" ? "selected" : ""}>비회원 LC 30일권 (이번 달 LC 모의고사)</option><option value="rc" ${s.plan === "rc" ? "selected" : ""}>비회원 RC 30일권 (이번 달 Season RC 문제)</option><option value="lcrc" ${s.plan === "lcrc" ? "selected" : ""}>비회원 LC+RC 30일권 (둘 다)</option></select>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px"><input type="checkbox" id="f-mem" ${isNew || s.member ? "checked" : ""} style="width:20px;height:20px">수업 들은 학생 (결제할 때 수강생 가격 적용)</label>
    <div class="grid"><div><label>시작일</label><input class="in" type="date" id="f-start" value="${esc(s.start_date)}"></div>
      <div><label>종료일</label><input class="in" type="date" id="f-end" value="${esc(s.end_date)}"></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn ghost sm" data-dur="me">이번 달 말까지</button>${[1, 2, 3].map(function (n) { return `<button class="btn ghost sm" data-dur="${n}">${n}개월</button>`; }).join("")}</div>
    <label>볼 수 있는 Season (직접 고르기)</label>

    <label>메모 (반 · 입금 등)</label><input class="in" id="f-memo" value="${esc(s.memo || "")}">
    <div id="f-msg"></div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="f-save" style="flex:1;padding:14px">저장</button><button class="btn ghost" id="f-cancel">취소</button></div>
    ${isNew ? "" : '<div style="margin-top:18px;text-align:right"><button class="btn red sm" id="f-del">수강생 삭제</button></div>'}`);
  m.querySelectorAll("[data-dur]").forEach(function (b) {

      if (b.dataset.dur === "me") { m.querySelector("#f-end").value = monthEnd(st); return; }
      var p = st.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]); d.setMonth(d.getMonth() + +b.dataset.dur); d.setDate(d.getDate() - 1);

  });
  function sea() { var st = m.querySelector("#f-start").value, en = m.querySelector("#f-end").value, el = m.querySelector("#f-sea"), pl = m.querySelector("#f-plan").value;
    var pick = [].map.call(m.querySelectorAll("#f-seas input:checked"), function (c) { return "Season " + c.value; });

    catTxt = catTxt ? catTxt.map(function (k) { return CATS.filter(function (c) { return c[0] === k; })[0][1]; }).join(", ") : "전체 (LC · RC · A급 과제 · VOCA)";
    var seaTxt = pick.length ? pick.join(", ") + " (직접 고름)" : pl ? "이번 달 Season (체크하면 그 Season으로)" : (seaPlan(st, en).replace("열리는 Season: ", "") || "기간을 넣으면 보여요") + " (기간 기준 자동)";
    el.innerHTML = "열리는 Season: <b>" + seaTxt + "</b><br>열리는 카테고리: <b>" + catTxt + "</b>" + (cats.length ? " (직접 고름)" : pl ? " (상품 기본)" : " (기본)");

  m.querySelectorAll("#f-seas input").forEach(function (c) { c.addEventListener("change", sea); });

  m.querySelectorAll("[data-dur]").forEach(function (b) { b.addEventListener("click", sea); });
  sea();

    rpc("admin_delete_student", { p_id: s.id }).then(function () { m.remove(); refresh(); }).catch(function (e) { alert(e.message); });

  m.querySelector("#f-save").onclick = function () {

      p_memo: m.querySelector("#f-memo").value.trim(), p_plan: m.querySelector("#f-plan").value || null };

    if (!v.p_start || !v.p_end || v.p_end < v.p_start) { msg.innerHTML = '<div class="msg err">시작일·종료일을 확인해 주세요.</div>'; return; }
    var dup = students.find(function (x) { return x.id !== s.id && x.name === v.p_name && String(x.phone).slice(-4) === v.p_phone.slice(-4); });

    var cats = [].map.call(m.querySelectorAll("#f-cats input:checked"), function (c) { return c.value; });
    rpc("admin_save_student", v).then(function (id) { id = id || s.id; return rpc("admin_set_seasons", { p_id: id, p_seasons: seas }).then(function () { return rpc("admin_set_cats", { p_id: id, p_cats: cats }); }).then(function () { return rpc("admin_set_member", { p_id: id, p_member: m.querySelector("#f-mem").checked }); }); }).then(function () { m.remove(); refresh(); }).catch(function (e) { msg.innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; });
  };
}

/* ---------- 진도 보기 ---------- */
function report(s) {
  var m = modal(`<h2>${esc(s.name)} 진도</h2><p class="note">불러오는 중…</p>`);
  rpc("admin_student_report", { p_id: s.id }).then(function (r) {
    var secs = r.sections || [], days = r.days || {}, games = r.games || [];
    var tot = secs.reduce(function (a, x) { return a + x.n; }, 0), ok = secs.reduce(function (a, x) { return a + x.ok; }, 0);
    // 최근 28일 학습량 막대
    var arr = [], mx = 1;
    for (var i = 27; i >= 0; i--) { var d = today(-i), n = days[d] || 0; arr.push([d, n]); if (n > mx) mx = n; }
    var active = arr.filter(function (x) { return x[1]; }).length;
    // 묶음(그룹)별로 정리
    var groups = {}, order = [];
    secs.forEach(function (x) { var g = (x.area ? x.area + " · " : "") + (x.group || "기타"); if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(x); });
    m.querySelector(".card").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><h2>${esc(s.name)} 진도</h2><div class="note">${kindTag(s)} ${esc(s.start_date)} ~ ${esc(s.end_date)} ${stTag(s)}</div></div><button class="btn ghost sm" id="r-x">닫기</button></div>
      <div class="stat" style="margin-top:12px"><div><b>${tot}</b>푼 문제</div><div><b>${tot ? Math.round(ok / tot * 100) : 0}%</b>정답률</div><div><b>${active}일</b>최근 4주 학습일</div><div><b>${r.logins || 0}회</b>접속</div></div>
      <div class="card" style="margin-top:12px"><p class="sec">최근 4주 하루 학습량 (문제 수)</p>
        <div class="days">${arr.map(function (x) { return `<div class="${x[1] ? "" : "z"}" title="${x[0]}: ${x[1]}문제" style="height:${x[1] ? Math.max(8, Math.round(x[1] / mx * 100)) : 3}%"></div>`; }).join("")}</div>
        <div class="dlab"><span>${md(arr[0][0])}</span><span>오늘</span></div>
        <p class="note" style="margin:8px 0 0">마지막 학습 ${ago(secs[0] && secs[0].last)} · 마지막 접속 ${ago(r.last_login)}</p></div>
      ${secs.length ? order.map(function (g) {
        return `<p class="grp">${esc(g)}</p><table><tr><th>단원</th><th style="width:30%">진행</th><th>정답률</th><th>최근</th></tr>${groups[g].map(function (x) {
          var pct = x.total ? Math.min(100, Math.round(x.n / x.total * 100)) : 0;
          return `<tr><td>${esc(x.title)}${x.season ? ` <span class="tag full">S${esc(x.season)}</span>` : ""}</td><td><div class="bar"><i style="width:${pct}%"></i></div><span style="font-size:12.5px;font-weight:700">${x.n}${x.total ? " / " + x.total : ""}</span></td><td><b>${x.n ? Math.round(x.ok / x.n * 100) : 0}%</b></td><td>${md(x.last)}</td></tr>`;
        }).join("")}</table>`;
      }).join("") : '<p class="note" style="margin-top:14px">아직 푼 문제가 없어요.</p>'}
      ${games.length ? `<p class="grp">VOCA 단어 게임</p><p class="note">${games.map(function (g) { return "DAY " + g.day + " " + "★".repeat(g.stars || 0) + " (" + g.plays + "회)"; }).join(" · ")}</p>` : ""}
      <p class="note" style="margin-top:14px">문제를 풀고 채점한 기록 기준이에요. 해설강의 시청 시간은 따로 기록되지 않아요.</p>`;
    m.querySelector("#r-x").onclick = function () { m.remove(); };
    var nb = document.createElement("div"); nb.style.marginTop = "14px";
    nb.innerHTML = '<p class="grp">A급 과제 오답노트</p><div id="r-on" class="note">불러오는 중…</div>';
    m.querySelector(".card").appendChild(nb); onoteList(s, nb.querySelector("#r-on"));
  }).catch(function (e) { m.querySelector(".card").innerHTML = '<div class="msg err">' + esc(e.message) + '</div><button class="btn ghost" onclick="this.closest(\'.modal\').remove()">닫기</button>'; });
}

/* ---------- A급 과제 오답노트 (학생이 푼 기록으로 그대로 다시 만든다) ---------- */
var ON_CAT = null, ON_RCT = null;
function onoteList(s, box) {
  Promise.all([ON_CAT ? ON_CAT : rpc("admin_get_content", { p_key: "catalog" }), rpc("admin_student_progress", { p_id: s.id, p_prefix: "" }),
    ON_RCT ? ON_RCT : fetch("/study/rctypes.json?t=" + Date.now()).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })]).then(function (x) {
    ON_CAT = x[0]; ON_RCT = x[2] || {}; var prog = x[1] || {};
    var secs = ((ON_CAT || {}).sections || []).filter(function (c) { return c.group === "A급 과제" && c.area !== "LC" && c.part >= 5; });
    var rounds = {}, order = [];
    secs.forEach(function (c) {
      var keys = c.keys || [], done = keys.filter(function (k) { return prog[k]; }).length; if (!done) return;
      var ser = +(c.series || 3), id = ser + "-" + c.round;
      if (!rounds[id]) { rounds[id] = { ser: ser, n: c.round, secs: [], done: 0, total: 0, ok: 0, last: "" }; order.push(id); }
      var r = rounds[id]; r.secs.push(c); r.done += done; r.total += keys.length;
      keys.forEach(function (k) { var p = prog[k]; if (p) { if (p[1]) r.ok++; if (String(p[2] || "") > r.last) r.last = String(p[2] || ""); } });
    });
    order.sort(function (a, b) { return rounds[b].last.localeCompare(rounds[a].last); });
    if (!order.length) { box.innerHTML = "아직 푼 A급 과제가 없어요."; return; }
    box.innerHTML = '<table><tr><th>회차</th><th>푼 문제</th><th>정답</th><th>최근</th><th></th></tr>' + order.map(function (id) {
      var r = rounds[id];
      return "<tr><td>" + r.n + "회 <span class=\"tag full\">S" + r.ser + "</span></td><td>" + r.done + " / " + r.total + "</td><td>" + r.ok + "</td><td>" + md(r.last) + '</td><td><button class="btn navy sm" data-on="' + id + '">오답노트</button></td></tr>';
    }).join("") + "</table>";
    box.querySelectorAll("[data-on]").forEach(function (b) { b.onclick = function () {
      var r = rounds[b.dataset.on]; b.disabled = true; b.textContent = "여는 중…";
      Promise.all(r.secs.slice().sort(function (a, c) { return a.part - c.part; }).map(function (c) { return rpc("admin_get_content", { p_key: "sec:" + c.id }); })).then(function (full) {
        var parts = full.map(function (sec) {
          return { part: sec.part, title: String(sec.title || "").replace(/^A급 과제 \d+회 · PART \d\s*/, "").replace(/^\(|\)$/g, ""), list: MKONOTE.itemsOf(sec).filter(function (it) { return prog[it.key]; }).map(function (it) {
            var p = prog[it.key]; return { key: it.key, q: it.q, set: it.set, mine: p[0], ok: !!p[1], type: ON_RCT[it.key] || MKONOTE.guess(it.q, it.set, sec.part) };
          }) };
        });
        var last = r.last ? new Date(r.last) : new Date();
        MKONOTE.open({ name: s.name, title: "A급 과제 " + r.n + "회 (Season " + r.ser + ")", date: last.getFullYear() + "." + (last.getMonth() + 1) + "." + last.getDate(), parts: parts });
        b.disabled = false; b.textContent = "오답노트";
      }).catch(function (e) { b.disabled = false; b.textContent = "오답노트"; alert(e.message || e); });
    }; });
  }).catch(function (e) { box.innerHTML = '<span style="color:#C00">' + esc(e.message || e) + "</span>"; });
}

/* ---------- 당일 수업 녹화 (유튜브 링크) ---------- */

  render(head() + '<div class="card">불러오는 중…</div>'); bindHead();
  rpc("admin_get_content", { p_key: "videos" }).then(function (v) {
    v = v || {};
    var list = (v.rec || []).slice().sort(function (a, b) { return String(b.d || "").localeCompare(String(a.d || "")); });
    function row(r) {
      return `<div class="rec"><input class="in" type="date" data-k="d" value="${esc(r.d || today())}"><input class="in" data-k="t" placeholder="제목 (예: 11월 3일 LC 수업)" value="${esc(r.t || "")}">
        <input class="in" data-k="u" placeholder="유튜브 주소 붙여넣기" value="${esc(r.u || "")}"><select class="in" data-k="s"><option value="">모든 Season</option>${[1, 2, 3].map(function (n) { return `<option value="${n}" ${+r.s === n ? "selected" : ""}>Season ${n}</option>`; }).join("")}</select>
        <button class="btn red sm" data-rm>✕</button></div>`;
    }

      <p class="note" style="margin-top:0">유튜브에 <b>일부 공개</b>로 올린 수업 영상 주소를 붙여 넣고 저장하면, 학생 학습실의 빨간 <b>🎥 당일 수업 녹화</b> 버튼에 최신순으로 나와요. Season을 고르면 그 Season 학생에게만 보여요.</p>
      <div id="r-list">${list.map(row).join("")}</div>
      <button class="btn ghost" id="r-add" style="width:100%">+ 녹화 영상 추가</button>
      <div id="r-msg"></div><button class="btn" id="r-save" style="width:100%;padding:14px;margin-top:8px">저장</button></div>`);
    bindHead();
    var box = document.getElementById("r-list");
    function bindRm() { box.querySelectorAll("[data-rm]").forEach(function (b) { b.onclick = function () { b.closest(".rec").remove(); }; }); }
    bindRm();
    document.getElementById("r-add").onclick = function () { box.insertAdjacentHTML("afterbegin", row({ d: today(), t: "", u: "", s: "" })); bindRm(); box.querySelector("[data-k=t]").focus(); };
    document.getElementById("r-save").onclick = function () {
      var out = [], bad = 0;
      box.querySelectorAll(".rec").forEach(function (el) {
        var r = {}; el.querySelectorAll("[data-k]").forEach(function (i) { r[i.dataset.k] = i.value.trim(); });
        if (!r.u) return;

        out.push({ t: r.t || (r.d + " 수업"), d: r.d, u: r.u, s: r.s ? +r.s : null });
      });
      var msg = document.getElementById("r-msg");
      if (bad) { msg.innerHTML = '<div class="msg err">유튜브 주소가 아닌 칸이 ' + bad + "개 있어요.</div>"; return; }
      var o = Object.assign({}, v, { rec: out });
      rpc("admin_put_content", { p_key: "videos", p_data: o, p_text: null }).then(function () { v = o; msg.innerHTML = '<div class="msg ok">저장했어요. (' + out.length + "개)</div>"; })
        .catch(function (e) { msg.innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; });
    };
  }).catch(function (e) { render(head() + '<div class="msg err">' + esc(e.message) + "</div>"); bindHead(); });
}

          return `<tr><td style="white-space:nowrap">${dt(o.approved_at || o.created_at)}</td><td>${esc(o.name)}<div style="font-size:12.5px">${esc(phoneFmt(o.phone))}</div></td><td>${esc(o.product || "")}</td><td style="white-space:nowrap">${(o.amount || 0).toLocaleString()}원</td><td>${ST[o.status] || esc(o.status)}${o.method ? '<div style="font-size:12.5px">' + esc(o.method) + '</div>' : ''}</td></tr>`;
        }).join("")}</table></div>` : '<p class="note">아직 결제 기록이 없어요.</p>');
    render(head() + `<div class="card"><div class="stat"><div><b>${L.length}</b>등록한 비회원</div><div><b>${paid}</b>결제한 사람</div><div><b>${L.length - paid}</b>미결제</div><div><b>${sum.toLocaleString()}</b>결제 금액(원)</div></div></div>
      <div class="card"><div class="chips"><button data-lt="leads" class="${logTab === "leads" ? "on" : ""}">비회원 등록 (${L.length})</button><button data-lt="orders" class="${logTab === "orders" ? "on" : ""}">결제 내역 (${O.length})</button></div>
      <p class="note" style="margin-top:0">${logTab === "leads" ? "결제 화면에서 이름 · 휴대폰을 등록한 사람이에요. 미결제인 사람에게는 문자 보내기로 결제를 안내할 수 있어요." : "결제 화면에서 결제 버튼을 누른 기록이에요. '결제 안 함'은 결제창을 열었다가 끝내지 않은 경우예요."}</p>${body}</div>`);
    bindHead();
    app.querySelectorAll("[data-lt]").forEach(function (b) { b.onclick = function () { logTab = b.dataset.lt; viewLog(); }; });
  }).catch(function (e) { render(head() + '<div class="msg err">' + esc(e.message) + "</div>"); bindHead(); });
}

/* ---------- 상품 가격 (비회원 30일권) ---------- */
function viewPrice() {
  render(head() + '<div class="card">불러오는 중…</div>'); bindHead();
  rpc("admin_prices").then(function (c) {
    c = c || {};
    var rows = [["lc_price", "LC 30일권", "고른 Season의 LC 실전 모의고사"], ["rc_price", "RC 30일권", "고른 Season의 RC 문제 (A급 과제 제외)"], ["lcrc_price", "LC+RC 30일권", "LC + RC 둘 다"]];
    render(head() + `<div class="card"><p class="sec">결제 화면 가격</p>
      <p class="note" style="margin-top:0">가격을 비워 두면 그 상품은 결제 화면에 안 나와요. 바꾸면 바로 결제 화면에 적용돼요.</p>
      <p class="note"><b>수강생 가격</b>은 메이크토익에서 수업을 들은 학생(관리자에서 '수업 들은 학생'으로 표시된 학생)이 결제 화면에 등록된 이름·번호를 적으면 자동으로 적용돼요. 비워 두면 비회원 가격과 같아요.</p>
      ${rows.map(function (r) { return `<div style="border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px"><b style="color:var(--navy)">${r[1]}</b> <span style="font-size:13px;font-weight:600">· ${r[2]}</span>
        <div class="grid" style="margin-top:6px"><div><label style="margin-top:0">비회원 가격</label><div style="display:flex;gap:6px;align-items:center"><input class="in" inputmode="numeric" data-pk="${r[0]}" value="${esc(c[r[0]] || "")}" placeholder="판매 안 함"><b>원</b></div></div>
        <div><label style="margin-top:0">수강생 가격</label><div style="display:flex;gap:6px;align-items:center"><input class="in" inputmode="numeric" data-pk="${r[0]}_m" value="${esc(c[r[0] + "_m"] || "")}" placeholder="비회원과 같음"><b>원</b></div></div></div></div>`; }).join("")}
      <div style="border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px"><b style="color:var(--navy)">수업 끝난 수강생 이용권 (1개월)</b> <span style="font-size:13px;font-weight:600">· LC 그 달 Season 전체 + RC 기출</span>
        <div style="display:flex;gap:6px;align-items:center;margin-top:6px"><input class="in" inputmode="numeric" data-pk="pass_price" value="${esc(c.pass_price || "")}"><b>원</b></div></div>
      <div id="pr-msg"></div><button class="btn" id="pr-save" style="width:100%;padding:14px;margin-top:12px">가격 저장</button></div>`);
    bindHead();
    document.getElementById("pr-save").onclick = function () {
      var jobs = [], bad = false, msg = document.getElementById("pr-msg");
      app.querySelectorAll("[data-pk]").forEach(function (i) {
        var v = i.value.replace(/[^0-9]/g, ""), n = v ? +v : null;
        if (n !== null && (n < 100 || n > 10000000)) bad = true;
        if (i.dataset.pk === "pass_price" && n === null) bad = true;
        jobs.push([i.dataset.pk, n]);
      });
      if (bad) { msg.innerHTML = '<div class="msg err">가격을 확인해 주세요 (100원 이상, 수강생 이용권은 비울 수 없어요).</div>'; return; }
      Promise.all(jobs.map(function (j) { return rpc("admin_set_price", { p_key: j[0], p_price: j[1] }); }))
        .then(function () { msg.innerHTML = '<div class="msg ok">저장했어요. 결제 화면에 바로 적용돼요.</div>'; })
        .catch(function (e) { msg.innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; });
    };
  }).catch(function (e) { render(head() + '<div class="msg err">' + esc(e.message) + "</div>"); bindHead(); });
}

/* ---------- 비밀번호 새로 정하기 (일회용 링크: /admin/#reset=코드) ---------- */
function viewReset(code) {
  render(`<div class="card hero"><span class="kicker">MAKE TOEIC · 학습실 관리자</span><h1>새 비밀번호 정하기</h1></div>
  <div class="card" style="max-width:460px">
    <p class="note" style="margin-top:0">관리자 계정(js1432@naver.com)의 새 비밀번호를 정하세요. 이 링크는 한 번만 쓸 수 있어요.</p>
    <label>새 비밀번호 (8자 이상)</label><input class="in" id="r1" type="password" autocomplete="new-password">
    <label>새 비밀번호 한 번 더</label><input class="in" id="r2" type="password" autocomplete="new-password">
    <div id="rmsg"></div>
    <button class="btn" id="rgo" style="width:100%;margin-top:14px;padding:14px">비밀번호 저장</button></div>`);
  document.getElementById("rgo").onclick = function () {
    var a = document.getElementById("r1").value, b = document.getElementById("r2").value, msg = document.getElementById("rmsg");
    if (a.length < 8) { msg.innerHTML = '<div class="msg err">8자 이상으로 정해 주세요.</div>'; return; }
    if (a !== b) { msg.innerHTML = '<div class="msg err">두 칸이 서로 달라요.</div>'; return; }
    rpc("admin_reset_password", { p_token: code, p_pw: a }).then(function (r) {
      if (r === "ok") {
        history.replaceState(null, "", location.pathname);
        viewLogin('<div class="msg ok">새 비밀번호로 바꿨어요. 이제 로그인하세요.</div>');
        document.getElementById("ad-email").value = "js1432@naver.com";
      } else msg.innerHTML = '<div class="msg err">' + (r === "short" ? "8자 이상으로 정해 주세요." : "이 링크는 이미 썼거나 시간이 지났어요. 새 링크를 받아 주세요.") + "</div>";
    }).catch(function (e) { msg.innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; });
  };
}

/* ---------- 시작 ---------- */
try {
  sb = window.supabase.createClient(U, K);
  var rs = location.hash.match(/reset=([0-9a-f-]{36})/);
  if (rs) viewReset(rs[1]);
  else sb.auth.getSession().then(function (r) { if (r.data.session) afterLogin(); else viewLogin(); });
} catch (e) { render('<div class="card">관리 도구를 불러오지 못했어요. 새로고침해 주세요.</div>'); }
})();
</script>
