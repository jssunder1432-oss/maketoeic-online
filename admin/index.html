<!doctype html>
<html lang="ko">
<head>

<title>학습실 관리자 · MAKE TOEIC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#172844;--orange:#FF581F;--bg:#F5F7FA;--line:#E3E7EF;--text:#1F2937;--ok:#1E8E5A;--bad:#D2453B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(125deg,#14233E,#233C5C);color:#fff;border:0}
.hero h1{margin:2px 0 0;font-size:22px;color:#fff}
.kicker{font-size:12px;font-weight:800;letter-spacing:2px;color:#FF8A5C}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;background:var(--orange);color:#fff;cursor:pointer}
.btn.navy{background:var(--navy)}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}.btn.red{background:#fff;border:1.5px solid var(--bad);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tabs button.t{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;color:var(--navy)}
.tabs button.t.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px}
label{display:block;font-size:14px;font-weight:800;color:var(--navy);margin:10px 0 4px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat div{background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:13px;font-weight:700;color:var(--navy)}
.stat b{display:block;font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:800;cursor:pointer;color:var(--navy)}
.chips button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.st{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;background:#fff}
.st .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.st .nm{font-size:18px;font-weight:800;color:var(--navy)}
.st .info{font-size:14px;color:var(--text);margin-top:3px}
.st .prog{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st .prog span{background:var(--bg);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700;color:var(--navy)}
.st .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12.5px;font-weight:800;white-space:nowrap}
.tag.ok{background:#E3F4EB;color:var(--ok)}.tag.soon{background:#FFEDE3;color:#D9480F}.tag.end{background:#FBE7E5;color:var(--bad)}
.tag.lc{background:#E6EEFF;color:#2952CC}.tag.full{background:#FFF1D6;color:#8A5300}
.msg{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;font-weight:700}.msg.err{background:#FBE7E5;color:var(--bad)}.msg.ok{background:#E3F4EB;color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(23,40,68,.55);display:flex;align-items:flex-end;justify-content:center;z-index:99;padding:0}
.modal .card{width:100%;max-width:640px;max-height:92vh;overflow:auto;margin:0;border-radius:18px 18px 0 0}
@media(min-width:700px){.modal{align-items:center;padding:16px}.modal .card{border-radius:18px}}
.modal h2{margin:0 0 4px;font-size:20px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
th{background:var(--bg);font-size:13px;color:var(--navy)}
.bar{height:8px;background:#E9EDF3;border-radius:99px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--orange)}
.days{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px}
.days div{flex:1;background:var(--orange);border-radius:3px 3px 0 0;min-height:2px}
.days div.z{background:#E3E7EF}
.dlab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--navy);margin-top:4px}
.grp{font-size:15px;font-weight:800;color:var(--navy);margin:14px 0 6px}
.sec{font-size:15px;font-weight:800;color:var(--navy);margin:0 0 8px}
.note{font-size:14px;color:var(--text)}
.rec{display:grid;grid-template-columns:1fr;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.rec .rf{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.rec .rf .pf{display:inline-flex;align-items:center;gap:6px;background:#FFF1E6;border:1px solid #F3C9A8;border-radius:99px;padding:5px 6px 5px 12px;font-size:13.5px;font-weight:700}.rec .rf .pf button{border:0;background:#fff;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer}.rec .rf label{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed #172844;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:800;cursor:pointer}.rec .rf input[type=file]{display:none}.rec .rf .up{font-size:13px;color:#E95721;font-weight:800}
@media(min-width:700px){.rec{grid-template-columns:130px 1.2fr 2fr 90px 40px;align-items:center}}
</style>
</head>

function serForMonth(y, m) { var k = ((y - 2026) * 12 + m - 10) % 3; k = (k + 3) % 3; return [3, 2, 1][k]; }
// 학습실과 같은 규칙: 등록 기간에 걸친 달마다 그 달의 Season이 열림 (2026년 10월부터, 이번 달까지)
function seasonsOf(start, end, upToNow) {
  var st = String(start || "").split("-"), en = String(end || "").split("-"), out = [];
  if (st.length < 2 || en.length < 2) return out;
  var y = +st[0], m = +st[1], ey = +en[0], em = +en[1], now = new Date();
  if (y * 12 + m < 2026 * 12 + 10) { y = 2026; m = 10; }
  if (upToNow && ey * 12 + em > now.getFullYear() * 12 + now.getMonth() + 1) { ey = now.getFullYear(); em = now.getMonth() + 1; }
  for (var i = 0; i < 36 && y * 12 + m <= ey * 12 + em; i++) { out.push([y, m, serForMonth(y, m)]); m++; if (m > 12) { m = 1; y++; } }
  return out;
}
function seaTag(s) {
  var ct = s.cats && s.cats.length ? ' <span class="tag soon">' + s.cats.map(function (k) { return { lcmock: "LC모의", lcp2: "LC유형", rcbook: "RC교재", agrade: "A급", voca: "VOCA" }[k]; }).join("·") + '</span>' : "";
  if (PLAN_NM[s.plan] && !(s.seasons && s.seasons.length)) return ct;

  var a = seasonsOf(s.start_date, s.end_date, true), u = [];

}
function seaPlan(start, end) {
  var a = seasonsOf(start, end, false);
  if (!a.length) return "";

}

/* ---------- 로그인 ---------- */
function viewLogin(msg) {

/* ---------- 상단 ---------- */
function head() {
  return `<div class="card hero"><span class="kicker">MAKE TOEIC · 학습실 관리자</span><h1>${view === "att" ? "당일 출석 현황" : view === "notice" ? "수업 공지 게시판" : view === "blog" ? "블로그 이미지" : view === "rec" ? "당일 수업 녹화" : view === "price" ? "상품 가격" : view === "log" ? "등록 · 결제 기록" : view === "hw" ? "A급 과제 제출 현황" : view === "ot" ? "OT 기초 진단 · 매일 공부 가이드" : "수강생 관리"}</h1></div>
  <div class="tabs"><button class="t ${view === "list" ? "on" : ""}" data-v="list">수강생 · 진도</button><button class="t ${view === "att" ? "on" : ""}" data-v="att">📅 오늘 출석</button><button class="t ${view === "notice" ? "on" : ""}" data-v="notice">📢 수업 공지</button><button class="t ${view === "hw" ? "on" : ""}" data-v="hw">📮 과제 제출</button><button class="t ${view === "ot" ? "on" : ""}" data-v="ot">📝 OT 기초 진단</button><button class="t ${view === "blog" ? "on" : ""}" data-v="blog">📰 블로그 이미지</button><button class="t ${view === "rec" ? "on" : ""}" data-v="rec">당일 수업 녹화</button><button class="t ${view === "log" ? "on" : ""}" data-v="log">등록 · 결제 기록</button><button class="t ${view === "price" ? "on" : ""}" data-v="price">상품 가격</button>

}

  app.querySelectorAll("[data-v]").forEach(function (b) { b.onclick = function () { view = b.dataset.v; view === "att" ? viewAtt(today()) : view === "notice" ? viewNotice() : view === "hw" ? viewHw() : view === "ot" ? viewOt() : view === "blog" ? viewBlog() : view === "rec" ? viewRecs() : view === "price" ? viewPrice() : view === "log" ? viewLog() : draw(); }; });
  document.getElementById("ad-out").onclick = function () { sb.auth.signOut().then(function () { viewLogin(); }); };

function refresh() { return rpc("admin_list_students").then(function (d) { students = d || []; SUBM = null; draw(); setTimeout(function () { try { blogAuto(); } catch (e) { } }, 4000); }).catch(function (e) { render('<div class="msg err">' + esc(e.message) + "</div>"); }); }
function stTag(s) { return s.days_left < 0 ? '<span class="tag end">만료</span>' : s.days_left <= 7 ? `<span class="tag soon">D-${s.days_left}</span>` : `<span class="tag ok">D-${s.days_left}</span>`; }
var CATS = [["lcmock", "LC 실전 모의고사 · 해설강의"], ["lcp2", "LC Part 2 유형별"], ["rcbook", "RC 교재 문제 · 실전 테스트"], ["agrade", "A급 과제 · 해설강의"], ["voca", "VOCA · 단어 게임"]];
var PLAN_CATS = { lc: ["lcmock"], rc: ["rcbook"], lcrc: ["lcmock", "rcbook"] };
var PLAN_NM = { lc: "LC 30일권", rc: "RC 30일권", lcrc: "LC+RC 30일권" };
var ONL_MK = "[온라인]";
function ONL(s) { return String(s.memo || "").indexOf(ONL_MK) === 0; }
function memoTxt(s) { return String(s.memo || "").replace(ONL_MK, "").trim(); }
function kindTag(s) { if (ONL(s)) return '<span class="tag lc">온라인 수강생</span>'; return (PLAN_NM[s.plan] ? '<span class="tag lc">' + PLAN_NM[s.plan] + '</span>' : '<span class="tag full">수강생</span>') + (PLAN_NM[s.plan] && s.member ? ' <span class="tag full">수업 들은 학생</span>' : ''); }
/* 과제 제출·오답노트(A급 과제 RC 푼 기록) 있는 학생을 목록 맨 위로 */
var SUBM = null, SUBM_ING = false;
function loadSubm() {
  if (SUBM_ING) return; SUBM_ING = true;
  var L = students.filter(function (s) { return s.days_left >= -31; });
  Promise.all(L.map(function (s) { return stuInfo(s).then(function (o) { return [s.id, o]; }); })).then(function (x) {
    var out = {};
    x.forEach(function (r) {
      var o = r[1], hd = Object.keys(o.hw).sort().pop() || "", ad = Object.keys(o.act).sort().pop() || "";
      o.hwD = hd; if (hd) { var h = o.hw[hd][0]; o.hwSer = h.ser; o.hwR = h.n; }
      o.aD = ad; if (ad) { var k = Object.keys(o.act[ad])[0], e = o.act[ad][k]; o.aOt = e.ot; o.aSer = e.ser; o.aR = e.n; o.aLab = hwLabel(e).replace(/<[^>]+>/g, ""); }
      out[r[0]] = o;
    });
    SUBM = out; SUBM_ING = false; draw();
  }).catch(function () { SUBM = {}; SUBM_ING = false; });
}
function draw() {
  if (view !== "list") return;
  if (!SUBM) loadSubm();
  var on = students.filter(function (s) { return s.days_left >= 0; });
  var soon = on.filter(function (s) { return s.days_left <= 7; }).length;
  var idle = on.filter(function (s) { return !s.week; }).length;
  var k = q.toLowerCase();
  var rows = students.filter(function (s) {
    if (k) return (s.name + s.phone + (s.memo || "")).toLowerCase().indexOf(k) >= 0;
    if (fil === "on" && s.days_left < 0) return false;
    if (fil === "end" && s.days_left >= 0) return false;
    if (fil === "idle" && (s.days_left < 0 || s.week)) return false;
    if (fil === "lc" && !PLAN_NM[s.plan]) return false;
    if (fil === "onl" && !ONL(s)) return false;
    if (fil === "sub" && !(SUBM && SUBM[s.id] && (SUBM[s.id].hwN || SUBM[s.id].aN))) return false;
    return !k || (s.name + s.phone + (s.memo || "")).toLowerCase().indexOf(k) >= 0;
  });
  if (SUBM) rows.sort(function (a, b) { var x = SUBM[a.id] || {}, y = SUBM[b.id] || {}; return String(y.last || "").localeCompare(String(x.last || "")) || ((y.aN ? 1 : 0) - (x.aN ? 1 : 0)); });
  var nSub = SUBM ? Object.keys(SUBM).filter(function (k) { return SUBM[k].hwN || SUBM[k].aN; }).length : 0;
  render(head() + `<div class="card"><div class="stat"><div><b>${on.length}</b>이용 중</div><div><b>${soon}</b>7일 내 만료</div><div><b>${idle}</b>이번 주 미학습</div><div><b>${students.length - on.length}</b>만료</div></div></div>
  <div class="card">

/* ---------- 등록 / 수정 ---------- */
function digits(x) { return String(x || "").replace(/\D/g, ""); }
function findDup(name, phone, exceptId) {
  var ph = digits(phone);
  return students.find(function (x) { return x.id !== exceptId && digits(x.phone) === ph; }) ||
    students.find(function (x) { return x.id !== exceptId && x.name === name && digits(x.phone).slice(-4) === ph.slice(-4); });
}
/* 재등록: 기존 학생 기록은 그대로 두고 기간만 이번 달로 바꾼다 (연속 등록이면 시작일 유지 → Season 누적) */
function renewCopy(s) {
  var c = Object.assign({}, s), t = today(), p = t.split("-"), prevFirst = ymd(new Date(+p[0], +p[1] - 2, 1));
  if (!(s.end_date >= prevFirst)) c.start_date = t;
  c.end_date = monthEnd(t); c.member = true;
  return c;
}
function editForm(s, renew, tpl) {
  var isNew = !s;
  if (renew) s = renewCopy(s);
  s = s || tpl || { name: "", phone: "", level: "기초", start_date: today(), end_date: monthEnd(today()), memo: "", plan: null };
  var m = modal(`<h2>${isNew ? "수강생 등록" : renew ? "수강생 재등록" : "수강생 수정"}</h2>${renew ? '<div class="msg ok">지난 등록 기록이 있는 학생이에요. 새로 만들지 않고 <b>기간만 이번 달로 바꿔 저장</b>해요 (학습 기록 유지). 연속 등록이면 시작일은 그대로 둬요.</div>' : ""}
    <p class="note" style="margin:0">학생은 <b>이름 + 휴대폰 번호 뒤 4자리</b>로 학습실에 들어가요.</p>
    <label>이름</label><input class="in" id="f-name" value="${esc(s.name)}">
    <label>휴대폰 번호</label><input class="in" id="f-phone" inputmode="numeric" value="${esc(s.phone)}" placeholder="01012345678">
    <label>구분</label><select class="in" id="f-plan"><option value="">수강생 (학습실 전체: LC·RC·A급·VOCA)</option><option value="lc" ${s.plan === "lc" ? "selected" : ""}>비회원 LC 30일권 (이번 달 LC 모의고사)</option><option value="rc" ${s.plan === "rc" ? "selected" : ""}>비회원 RC 30일권 (이번 달 Season RC 문제)</option><option value="lcrc" ${s.plan === "lcrc" ? "selected" : ""}>비회원 LC+RC 30일권 (둘 다)</option></select>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px"><input type="checkbox" id="f-onl" ${ONL(s) ? "checked" : ""} style="width:20px;height:20px">온라인 수강생 (온라인 only 정규반 · 따로 모아 보기)</label>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px"><input type="checkbox" id="f-mem" ${(isNew && !tpl) || s.member ? "checked" : ""} style="width:20px;height:20px">수업 들은 학생 (결제할 때 수강생 가격 적용)</label>
    <div class="grid"><div><label>시작일</label><input class="in" type="date" id="f-start" value="${esc(s.start_date)}"></div>
      <div><label>종료일</label><input class="in" type="date" id="f-end" value="${esc(s.end_date)}"></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn ghost sm" data-dur="me">이번 달 말까지</button>${[1, 2, 3].map(function (n) { return `<button class="btn ghost sm" data-dur="${n}">${n}개월</button>`; }).join("")}</div>
    <label>볼 수 있는 Season (직접 고르기)</label>
    <div id="f-seas" style="display:flex;gap:8px;flex-wrap:wrap">${[1, 2, 3].map(function (n) { return `<label style="margin:0;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;cursor:pointer"><input type="checkbox" value="${n}" ${(s.seasons || []).indexOf(n) >= 0 ? "checked" : ""} style="width:20px;height:20px">Season ${n}</label>`; }).join("")}</div>
    <label>볼 수 있는 카테고리 (직접 고르기)</label>
    <div id="f-cats" style="display:grid;gap:6px">${CATS.map(function (c) { return `<label style="margin:0;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;font-weight:700;cursor:pointer"><input type="checkbox" value="${c[0]}" ${(s.cats || []).indexOf(c[0]) >= 0 ? "checked" : ""} style="width:20px;height:20px">${c[1]}</label>`; }).join("")}</div>
    <div class="msg ok" id="f-sea" style="margin-top:10px"></div>
    <label>레벨</label><select class="in" id="f-level">${["기초", "중급", "고급"].map(function (l) { return `<option ${s.level === l ? "selected" : ""}>${l}</option>`; }).join("")}</select>
    <label>메모 (반 · 입금 등)</label><input class="in" id="f-memo" value="${esc(memoTxt(s))}">
    <div id="f-msg"></div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="f-save" style="flex:1;padding:14px">저장</button><button class="btn ghost" id="f-cancel">취소</button></div>
    ${isNew ? "" : '<div style="margin-top:18px;text-align:right"><button class="btn red sm" id="f-del">수강생 삭제</button></div>'}`);
  m.querySelectorAll("[data-dur]").forEach(function (b) {
    b.onclick = function () {
      var st = m.querySelector("#f-start").value || today();
      if (b.dataset.dur === "me") { m.querySelector("#f-end").value = monthEnd(st); return; }
      var p = st.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]); d.setMonth(d.getMonth() + +b.dataset.dur); d.setDate(d.getDate() - 1);
      m.querySelector("#f-end").value = ymd(d);
    };
  });
  function sea() { var st = m.querySelector("#f-start").value, en = m.querySelector("#f-end").value, el = m.querySelector("#f-sea"), pl = m.querySelector("#f-plan").value;
    var pick = [].map.call(m.querySelectorAll("#f-seas input:checked"), function (c) { return "Season " + c.value; });
    var cats = [].map.call(m.querySelectorAll("#f-cats input:checked"), function (c) { return c.value; });
    var catTxt = (cats.length ? cats : PLAN_CATS[pl] || null);
    catTxt = catTxt ? catTxt.map(function (k) { return CATS.filter(function (c) { return c[0] === k; })[0][1]; }).join(", ") : "전체 (LC · RC · A급 과제 · VOCA)";
    var seaTxt = pick.length ? pick.join(", ") + " (직접 고름)" : pl ? "이번 달 Season (체크하면 그 Season으로)" : (seaPlan(st, en).replace("열리는 Season: ", "") || "기간을 넣으면 보여요") + " (기간 기준 자동)";
    el.innerHTML = "열리는 Season: <b>" + seaTxt + "</b><br>열리는 카테고리: <b>" + catTxt + "</b>" + (cats.length ? " (직접 고름)" : pl ? " (상품 기본)" : " (기본)");
  }
  m.querySelectorAll("#f-cats input").forEach(function (c) { c.addEventListener("change", sea); });
  if (isNew) m.querySelector("#f-plan").addEventListener("change", function () { m.querySelector("#f-mem").checked = !m.querySelector("#f-plan").value; });
  m.querySelectorAll("#f-seas input").forEach(function (c) { c.addEventListener("change", sea); });
  ["#f-start", "#f-end", "#f-plan"].forEach(function (q) { m.querySelector(q).addEventListener("change", sea); m.querySelector(q).addEventListener("input", sea); });
  m.querySelectorAll("[data-dur]").forEach(function (b) { b.addEventListener("click", sea); });
  sea();
  m.querySelector("#f-cancel").onclick = function () { m.remove(); };
  var del = m.querySelector("#f-del");
  if (del) del.onclick = function () {
    if (!confirm(s.name + " 님을 삭제할까요?\n학습 기록도 함께 지워지고 되돌릴 수 없어요.\n(기간만 끝내려면 종료일을 바꾸세요)")) return;
    rpc("admin_delete_student", { p_id: s.id }).then(function () { m.remove(); refresh(); }).catch(function (e) { alert(e.message); });
  };
  m.querySelector("#f-save").onclick = function () {
    var v = { p_id: s.id || null, p_name: m.querySelector("#f-name").value.trim(), p_phone: m.querySelector("#f-phone").value.replace(/\D/g, ""),
      p_level: m.querySelector("#f-level").value, p_start: m.querySelector("#f-start").value, p_end: m.querySelector("#f-end").value,
      p_memo: ((m.querySelector("#f-onl").checked ? ONL_MK + " " : "") + m.querySelector("#f-memo").value.replace(ONL_MK, "").trim()).trim(), p_plan: m.querySelector("#f-plan").value || null };
    var msg = m.querySelector("#f-msg");
    if (!v.p_name || v.p_phone.length < 10) { msg.innerHTML = '<div class="msg err">이름과 휴대폰 번호(10~11자리)를 넣어 주세요.</div>'; return; }
    if (!v.p_start || !v.p_end || v.p_end < v.p_start) { msg.innerHTML = '<div class="msg err">시작일·종료일을 확인해 주세요.</div>'; return; }
    var dup = findDup(v.p_name, v.p_phone, s.id);
    if (dup) {
      if (isNew) {
        if (!confirm(dup.name + " 님은 이미 등록된 학생이에요 (" + dup.start_date + " ~ " + dup.end_date + ").\n새로 만들지 않고 이 학생 정보를 지금 입력한 내용으로 바꿔 저장할게요.\n(학습 기록은 그대로 남아요)")) return;
        var rc = renewCopy(dup), keepStart = rc.start_date === dup.start_date && v.p_start >= dup.start_date;
        v.p_id = dup.id; if (keepStart) v.p_start = dup.start_date; s = dup;
      } else { msg.innerHTML = '<div class="msg err">같은 휴대폰 번호(또는 이름+뒤 4자리) 학생이 이미 있어요: ' + esc(dup.name) + " (" + esc(dup.start_date) + " ~ " + esc(dup.end_date) + ")</div>"; return; }

          if (!x) throw e;
          v.p_id = x.id; s = x; return rpc("admin_save_student", v);
        });
      });
    }
    saveSt().then(function (id) { id = id || s.id; return rpc("admin_set_seasons", { p_id: id, p_seasons: seas }).then(function () { return rpc("admin_set_cats", { p_id: id, p_cats: cats }); }).then(function () { return rpc("admin_set_member", { p_id: id, p_member: m.querySelector("#f-mem").checked }); }); }).then(function () { m.remove(); refresh(); }).catch(function (e) { msg.innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; });
  };
}

/* ---------- 진도 보기 ---------- */
function report(s) {
  var m = modal(`<h2>${esc(s.name)} 진도</h2><p class="note">불러오는 중…</p>`);
  rpc("admin_student_report", { p_id: s.id }).then(function (r) {
    var secs = r.sections || [], days = r.days || {}, games = r.games || [];
    var tot = secs.reduce(function (a, x) { return a + x.n; }, 0), ok = secs.reduce(function (a, x) { return a + x.ok; }, 0);
    // 최근 28일 학습량 막대
    var arr = [], mx = 1;
    for (var i = 27; i >= 0; i--) { var d = today(-i), n = days[d] || 0; arr.push([d, n]); if (n > mx) mx = n; }
    var active = arr.filter(function (x) { return x[1]; }).length;
    // 묶음(그룹)별로 정리
    var groups = {}, order = [];
    secs.forEach(function (x) { var g = (x.area ? x.area + " · " : "") + (x.group || "기타"); if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(x); });

      <div class="stat" style="margin-top:12px"><div><b>${tot}</b>푼 문제</div><div><b>${tot ? Math.round(ok / tot * 100) : 0}%</b>정답률</div><div><b>${active}일</b>최근 4주 학습일</div><div><b>${r.logins || 0}회</b>접속</div></div>
      <div class="card" style="margin-top:12px"><p class="sec">최근 4주 하루 학습량 (문제 수)</p>
        <div class="days">${arr.map(function (x) { return `<div class="${x[1] ? "" : "z"}" title="${x[0]}: ${x[1]}문제" style="height:${x[1] ? Math.max(8, Math.round(x[1] / mx * 100)) : 3}%"></div>`; }).join("")}</div>
        <div class="dlab"><span>${md(arr[0][0])}</span><span>오늘</span></div>
        <p class="note" style="margin:8px 0 0">마지막 학습 ${ago(secs[0] && secs[0].last)} · 마지막 접속 ${ago(r.last_login)}</p></div>
      ${secs.length ? order.map(function (g) {
        return `<p class="grp">${esc(g)}</p><table><tr><th>단원</th><th style="width:30%">진행</th><th>정답률</th><th>최근</th></tr>${groups[g].map(function (x) {
          var pct = x.total ? Math.min(100, Math.round(x.n / x.total * 100)) : 0;
          return `<tr><td>${esc(x.title)}${x.season ? ` <span class="tag full">S${esc(x.season)}</span>` : ""}</td><td><div class="bar"><i style="width:${pct}%"></i></div><span style="font-size:12.5px;font-weight:700">${x.n}${x.total ? " / " + x.total : ""}</span></td><td><b>${x.n ? Math.round(x.ok / x.n * 100) : 0}%</b></td><td>${md(x.last)}</td></tr>`;
        }).join("")}</table>`;
      }).join("") : '<p class="note" style="margin-top:14px">아직 푼 문제가 없어요.</p>'}
      ${games.length ? `<p class="grp">VOCA 단어 게임</p><p class="note">${games.map(function (g) { return "DAY " + g.day + " " + "★".repeat(g.stars || 0) + " (" + g.plays + "회)"; }).join(" · ")}</p>` : ""}
      <p class="note" style="margin-top:14px">문제를 풀고 채점한 기록 기준이에요. 해설강의 시청 시간은 따로 기록되지 않아요.</p>`;

    m.querySelector(".card").appendChild(nb); onoteList(s, nb.querySelector("#r-on"));
    var hb = document.createElement("div"); hb.style.marginTop = "14px"; hb.innerHTML = '<p class="grp">📮 A급 과제 제출 · 오답노트</p><div class="note">불러오는 중…</div>'; m.querySelector(".card").insertBefore(hb, nb);
    rpc("admin_student_progress", { p_id: s.id, p_prefix: "" }).then(function (p) {

/* ---------- 당일 수업 녹화 (유튜브 링크) ---------- */

/* ---------- 당일 출석 현황 (2026-11-06): 학생이 학습실 첫 화면 출석 도장을 찍은 기록(progress "att:YYYY-MM-DD") ---------- */
var AT = { live: true };
var AT_HOURS = [1110, 1730, 1910];
function atHr(v) { v = +v || 0; var h = v >= 100 ? Math.floor(v / 100) : v, m = v >= 100 ? v % 100 : 0; return (h < 12 ? "오전 " : "오후 ") + (h > 12 ? h - 12 : h) + ":" + String(m).padStart(2, "0"); }

  return rpc("admin_student_progress", { p_id: s.id, p_prefix: "att:" }).catch(function () { return rpc("admin_student_progress", { p_id: s.id, p_prefix: "" }); }).catch(function () { return {}; }).then(function (p) {
    var o = {}; Object.keys(p || {}).forEach(function (k) { var m = k.match(/^att:(\d{4}-\d{2}-\d{2})$/); if (m && p[k] && p[k][1] && +p[k][0] > 0) o[m[1]] = +p[k][0]; }); return o;
  });

function atTick() { clearInterval(AT.t); if (AT.live) AT.t = setInterval(function () { if (view !== "att" || !document.getElementById("at-live")) { clearInterval(AT.t); return; } viewAtt(AT.day, true); }, 30000); }
function viewAtt(day, quiet) {
  day = day || AT.day || today(); AT.day = day;
  if (!quiet) { render(head() + '<div class="card">불러오는 중…</div>'); bindHead(); }
  var m0 = day.slice(0, 8) + "01", m1 = monthEnd(day);
  (students.length ? Promise.resolve(students) : rpc("admin_list_students").then(function (x) { students = x || []; return students; })).then(function (L) {
    // 그날이 수강 기간 안에 있는 현장 수강생 (온라인 수강생·비회원 30일권 제외) + 그 달에 도장 찍은 학생은 누구든
    var cand = L.filter(function (s) { return (!s.start_date || String(s.start_date) <= m1) && (!s.end_date || String(s.end_date) >= m0); });
    return Promise.all(cand.map(function (s) { return atProg(s).then(function (o) { return [s, o]; }); }));
  }).then(function (rows) {
    if (view !== "att") return;
    var dt0 = new Date(day + "T00:00:00"), W = "일월화수목금토", wk = dt0.getDay(), lab = (dt0.getMonth() + 1) + "월 " + dt0.getDate() + "일 (" + W[wk] + ")";
    rows = rows.filter(function (r) { var s = r[0], inDay = (!s.start_date || String(s.start_date) <= day) && (!s.end_date || String(s.end_date) >= day); return (atTarget(s) && inDay) || Object.keys(r[1]).some(function (d) { return d >= m0 && d <= m1; }); });
    rows.sort(function (a, b) { return String(a[0].name).localeCompare(String(b[0].name), "ko"); });
    var yes = rows.filter(function (r) { return r[1][day]; }), no = rows.filter(function (r) { return !r[1][day] && atTarget(r[0]); });
    var hrs = AT_HOURS.slice(); yes.forEach(function (r) { if (hrs.indexOf(r[1][day]) < 0) hrs.push(r[1][day]); }); hrs.sort(function (a, b) { return a - b; });
    // 이번 달 출석표: 그 달 평일 중 고른 날까지 (누군가 도장 찍은 날은 주말이어도)
    var days = [], d = new Date(m0 + "T00:00:00"), lim = day > today() ? day : (m1 < today() ? m1 : today());
    for (; ymd(d) <= m1; d.setDate(d.getDate() + 1)) { var k = ymd(d), w = d.getDay(); if ((w > 0 && w < 6 && k <= lim) || rows.some(function (r) { return r[1][k]; })) days.push(k); }
    var chip = function (s, sub) { return '<span class="tag ' + (sub ? "ok" : "end") + '" style="font-size:14px;padding:6px 11px;margin:0 4px 6px 0">' + esc(s.name) + (sub ? ' <small style="font-weight:700">' + sub + "</small>" : "") + "</span>"; };
    render(head() + `<div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input class="in" type="date" id="at-d" value="${esc(day)}" style="max-width:180px"><button class="btn ghost sm" id="at-p">◀ 전날</button><button class="btn ghost sm" id="at-n">다음날 ▶</button><button class="btn ghost sm" id="at-t">오늘</button><span style="flex:1"></span><button class="btn ${AT.live ? "" : "ghost"} sm" id="at-live">${AT.live ? "⏱ 실시간 켜짐 (30초마다)" : "⏱ 실시간 보기"}</button><button class="btn ghost sm" id="at-r">🔄 새로고침</button></div>
      <p class="note" style="margin:6px 0 0">마지막 확인 ${new Date().toLocaleTimeString("ko-KR")} · 학생이 학습실 첫 화면에서 출석 도장을 찍으면 ${AT.live ? "30초 안에 자동으로" : "새로고침하면"} 여기에 나와요. (온라인 수강생·비회원 30일권은 대상에서 빠져요)</p></div>
    <div class="card"><p class="sec" style="margin:0 0 8px;font-size:18px;font-weight:800;color:var(--navy)">📅 ${lab} 출석${wk === 0 || wk === 6 ? ' <span class="tag soon">주말</span>' : ""}</p>

      ${hrs.map(function (h) { var L = yes.filter(function (r) { return r[1][day] === h; }); return `<p class="grp">🕐 ${atHr(h)} 수업 · ${L.length}명</p><div>${L.map(function (r) { return chip(r[0], "✔"); }).join("") || '<span class="note">아직 없어요</span>'}</div>`; }).join("")}
      <p class="grp">⚠️ 미출석 · ${no.length}명</p><div>${no.map(function (r) { return chip(r[0], esc(String(r[0].phone || "").slice(-4))); }).join("") || '<span class="note">모두 출석했어요 🎉</span>'}</div>
    </div>
    <div class="card"><p class="grp" style="margin-top:0">${+day.slice(5, 7)}월 출석표 <small class="note" style="font-weight:700">● = 출석 (숫자는 수업 시각)</small></p>
      <div style="overflow-x:auto"><table style="min-width:${180 + days.length * 46}px"><tr><th style="position:sticky;left:0;background:var(--bg);min-width:90px">이름</th><th>출석</th>${days.map(function (k) { var x = new Date(k + "T00:00:00"); return '<th style="text-align:center;padding:6px 2px;' + (k === day ? "background:#FFE6D6" : "") + '">' + (x.getMonth() + 1) + "/" + x.getDate() + "<br><small>" + W[x.getDay()] + "</small></th>"; }).join("")}</tr>
      ${rows.map(function (r) { var n = days.filter(function (k) { return r[1][k]; }).length; return '<tr><td style="position:sticky;left:0;background:#fff;font-weight:800">' + esc(r[0].name) + "</td><td><b>" + n + "</b>/" + days.length + "</td>" + days.map(function (k) { var v = r[1][k]; return '<td style="text-align:center;padding:6px 2px;' + (k === day ? "background:#FFF4EC;" : "") + '">' + (v ? '<b style="color:#E0322B">●</b><br><small style="font-weight:700">' + Math.floor(v / 100) + ":" + String(v % 100).padStart(2, "0") + "</small>" : '<span style="color:#C9CFDA">·</span>') + "</td>"; }).join("") + "</tr>"; }).join("") || '<tr><td colspan="2" class="note">이 달 대상 학생이 없어요.</td></tr>'}</table></div>
      <button class="btn ghost sm" id="at-csv" style="margin-top:10px">⬇️ 출석표 엑셀(CSV) 내려받기</button></div>`);
    bindHead();
    function goD(x) { viewAtt(x); }
    function sh(n) { var x = new Date(day + "T00:00:00"); x.setDate(x.getDate() + n); goD(ymd(x)); }
    document.getElementById("at-d").onchange = function () { if (this.value) goD(this.value); };
    document.getElementById("at-p").onclick = function () { sh(-1); };
    document.getElementById("at-n").onclick = function () { sh(1); };
    document.getElementById("at-t").onclick = function () { goD(today()); };
    document.getElementById("at-r").onclick = function () { viewAtt(day, true); };
    document.getElementById("at-live").onclick = function () { AT.live = !AT.live; atTick(); viewAtt(day, true); };
    document.getElementById("at-csv").onclick = function () {
      var lines = [["이름", "전화번호", "출석"].concat(days)].concat(rows.map(function (r) { return [r[0].name, r[0].phone, days.filter(function (k) { return r[1][k]; }).length + "/" + days.length].concat(days.map(function (k) { var v = r[1][k]; return v ? Math.floor(v / 100) + ":" + String(v % 100).padStart(2, "0") : ""; })); }));
      var csv = "﻿" + lines.map(function (l) { return l.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "메이크토익_출석표_" + day.slice(0, 7) + ".csv"; document.body.appendChild(a); a.click(); a.remove();
    };

    render(head() + `<div class="card"><button class="btn" id="nt-add" style="width:100%;padding:14px;font-size:17px">+ 새 공지 쓰기</button>

          <label style="margin-top:0">상품 이름</label><input class="in" data-sf="t" data-si="${i}" value="${esc(x.t)}" placeholder="예: 주말특강 (11월)">
          <label>설명</label><input class="in" data-sf="b" data-si="${i}" value="${esc(x.b || "")}" placeholder="학생에게 보일 한 줄 설명">
          <label>상세 설명 (상품을 누르면 나오는 안내 · 한 줄에 하나씩)</label><textarea class="in" rows="4" data-sf="d" data-si="${i}" placeholder="예: 다음 달 정규 수업 1개월 등록">${esc(x.d || "")}</textarea>
          <div style="display:flex;gap:6px;align-items:center;margin-top:8px"><input class="in" inputmode="numeric" data-sf="p" data-si="${i}" value="${x.p > 0 ? x.p : ""}" placeholder="금액 문의"><b>원</b></div>
          ${x.parts ? `<label>골라서 결제하는 항목 (가격 비우면 '금액 문의' · 카드결제 안 됨)</label>${x.parts.map(function (q, k) { return `<div style="display:flex;gap:6px;align-items:center;margin-top:6px"><span style="flex:1;font-weight:700;font-size:14px">${esc(q.t)}</span><input class="in" style="max-width:130px" inputmode="numeric" data-spp="${i}:${k}" value="${q.p > 0 ? q.p : ""}" placeholder="금액 문의"><b>원</b></div>`; }).join("")}` : `<label>교재비 (넣으면 학생이 합산 결제 / 별도 결제를 골라요)</label><div style="display:flex;gap:6px;align-items:center"><input class="in" inputmode="numeric" data-sf="bk" data-si="${i}" value="${x.bk > 0 ? x.bk : ""}" placeholder="교재 선택 없음"><b>원</b></div>`}
          <div class="acts" style="margin-top:8px"><button class="btn ghost sm" data-sh="${i}">${x.hide ? "다시 보이기" : "숨기기"}</button><button class="btn ghost sm" data-su="${i}" ${i ? "" : "disabled"}>▲ 위로</button><button class="btn red sm" data-sx="${i}">삭제</button>${x.hide ? ' <span class="tag end">숨김</span>' : ""}</div></div>`;
      }).join("") + `<button class="btn ghost" id="sp-add" style="width:100%;margin-top:10px">+ 상품 추가</button>${msg || ""}<button class="btn" id="sp-save" style="width:100%;padding:14px;margin-top:10px">수업 결제 상품 저장</button>`;
      box.querySelectorAll("[data-sf]").forEach(function (i) { i.oninput = function () { var x = L[+i.dataset.si], f = i.dataset.sf; x[f] = (f === "p" || f === "bk") ? (+i.value.replace(/[^0-9]/g, "") || 0) : i.value; }; });
      box.querySelectorAll("[data-spp]").forEach(function (i) { i.oninput = function () { var a = i.dataset.spp.split(":"); L[+a[0]].parts[+a[1]].p = +i.value.replace(/[^0-9]/g, "") || 0; }; });
      box.querySelectorAll("[data-sh]").forEach(function (b) { b.onclick = function () { var x = L[+b.dataset.sh]; x.hide = !x.hide; draw(); }; });
      box.querySelectorAll("[data-su]").forEach(function (b) { b.onclick = function () { var i = +b.dataset.su; if (i) { var t = L[i]; L[i] = L[i - 1]; L[i - 1] = t; draw(); } }; });
      box.querySelectorAll("[data-sx]").forEach(function (b) { b.onclick = function () { if (confirm("이 상품을 지울까요?")) { L.splice(+b.dataset.sx, 1); draw(); } }; });
      document.getElementById("sp-add").onclick = function () { L.push({ id: "p" + Date.now(), t: "", b: "", p: 0 }); draw(); };
      document.getElementById("sp-save").onclick = function () {
        var out = L.filter(function (x) { return String(x.t || "").trim(); }).map(function (x) { return { id: x.id || ("p" + Date.now()), t: String(x.t).trim(), b: String(x.b || "").trim(), d: String(x.d || "").trim(), p: +x.p || 0, bk: +x.bk || 0, hide: !!x.hide, parts: x.parts ? x.parts.map(function (q) { return { id: q.id, t: q.t, p: +q.p || 0 }; }) : undefined }; });
        if (out.some(function (x) { return x.p && (x.p < 100 || x.p > 10000000); })) return draw('<div class="msg err">금액을 확인해 주세요 (100원 이상).</div>');
        rpc("admin_get_content", { p_key: "videos" }).then(function (cur) {
          return rpc("admin_put_content", { p_key: "videos", p_data: Object.assign({}, cur || {}, { spay: out }), p_text: null });
        }).then(function () { L = out; spFill = 0; draw('<div class="msg ok">저장했어요. 학생 앱 첫 화면 💳 수업 결제에 바로 나와요.</div>'); }).catch(function (e) { draw('<div class="msg err">' + esc(e.message || e) + "</div>"); });
      };
    }
    draw();
  }).catch(function (e) { box.innerHTML = '<div class="msg err">' + esc(e.message || e) + "</div>"; });
}

/* ---------- 비밀번호 새로 정하기 (일회용 링크: /admin/#reset=코드) ---------- */
function viewReset(code) {
  render(`<div class="card hero"><span class="kicker">MAKE TOEIC · 학습실 관리자</span><h1>새 비밀번호 정하기</h1></div>
  <div class="card" style="max-width:460px">
    <p class="note" style="margin-top:0">관리자 계정(js1432@naver.com)의 새 비밀번호를 정하세요. 이 링크는 한 번만 쓸 수 있어요.</p>
    <label>새 비밀번호 (8자 이상)</label><input class="in" id="r1" type="password" autocomplete="new-password">
    <label>새 비밀번호 한 번 더</label><input class="in" id="r2" type="password" autocomplete="new-password">
    <div id="rmsg"></div>
    <button class="btn" id="rgo" style="width:100%;margin-top:14px;padding:14px">비밀번호 저장</button></div>`);
  document.getElementById("rgo").onclick = function () {
    var a = document.getElementById("r1").value, b = document.getElementById("r2").value, msg = document.getElementById("rmsg");
    if (a.length < 8) { msg.innerHTML = '<div class="msg err">8자 이상으로 정해 주세요.</div>'; return; }
    if (a !== b) { msg.innerHTML = '<div class="msg err">두 칸이 서로 달라요.</div>'; return; }
    rpc("admin_reset_password", { p_token: code, p_pw: a }).then(function (r) {
      if (r === "ok") {
        history.replaceState(null, "", location.pathname);
        viewLogin('<div class="msg ok">새 비밀번호로 바꿨어요. 이제 로그인하세요.</div>');
        document.getElementById("ad-email").value = "js1432@naver.com";
      } else msg.innerHTML = '<div class="msg err">' + (r === "short" ? "8자 이상으로 정해 주세요." : "이 링크는 이미 썼거나 시간이 지났어요. 새 링크를 받아 주세요.") + "</div>";
    }).catch(function (e) { msg.innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; });
  };
}

/* ---------- 시작 ---------- */
try {
  sb = window.supabase.createClient(U, K);
  var rs = location.hash.match(/reset=([0-9a-f-]{36})/);
  if (rs) viewReset(rs[1]);
  else sb.auth.getSession().then(function (r) { if (r.data.session) afterLogin(); else viewLogin(); });
} catch (e) { render('<div class="card">관리 도구를 불러오지 못했어요. 새로고침해 주세요.</div>'); }
})();
</script>
