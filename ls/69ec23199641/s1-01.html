<style>
:root{--navy:#1F3864;--deep:#14264A;--orange:#F0562A;--ink:#101828;--text:#2A3345;--soft:#F3F5F9;--line:#E3E7EF;--hl:#FFE3D6;

*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font:400 16px/1.7 var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:800;color:var(--ink);margin:0;margin-right:auto;letter-spacing:-.02em}
.top h1 small{display:block;font-size:12px;font-weight:600;color:var(--orange)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:700 13px var(--font);color:var(--text);padding:7px 11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.tip{max-width:760px;margin:14px auto 0;padding:12px 14px;background:var(--soft);border-radius:12px;font-size:14px}
.tip b{color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:6px 16px 120px}
.part{margin:34px 0 10px;font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.set{margin:22px 0 8px;font-size:14px;font-weight:700;color:var(--navy)}
.qno{display:flex;align-items:center;gap:8px;margin:24px 0 6px;font-weight:800;color:var(--ink)}
.qno span{background:var(--navy);color:#fff;border-radius:8px;padding:2px 8px;font-size:14px}
.qno em{font-style:normal;font-size:13px;color:var(--orange)}
.en{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:17px;line-height:1.75;color:var(--ink)}
.en.q{font-weight:700}
.play{flex:none;width:30px;height:30px;margin-top:2px;border-radius:50%;border:0;background:var(--soft);color:var(--navy);cursor:pointer;display:grid;place-items:center}
.play svg{width:12px;height:12px}
.play.on{background:var(--orange);color:#fff}
.sp{flex:none;font:800 12px var(--font);color:var(--orange);margin-top:7px;min-width:20px}
.w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .1s}
.w:hover{background:var(--soft)}
.w.on{background:var(--hl);color:var(--ink)}
.ko{margin:2px 0 8px 38px;font-size:14px;color:var(--text)}
.exp{margin:2px 0 4px 38px;font-size:14px;color:var(--text);padding-left:10px;border-left:3px solid var(--line)}
body.hide-exp .exp{display:none}
body.hide-ko .ko{display:none}
.nosupport{display:none;background:#FFF1D6;color:#7A4100;border-radius:12px;padding:12px 14px;margin:14px auto 0;max-width:760px;font-size:14px}

    const w = document.createElement('span'); w.className='w'; w.textContent = tok;
    const clean = tok.replace(/^[^A-Za-z0-9$%]+|[^A-Za-z0-9%']+$/g,'');
    const wi = words.length;
    if (clean) w.onclick = () => { clearCur(); w.classList.add('on');
      const tt = b.w && b.w[tokIndex];
      if (tt) playSeg(Math.max(0, tt[0] - 0.04), tt[1] + 0.06, null, () => w.classList.remove('on'));
      else speak(clean, b.sp, null, () => w.classList.remove('on')); };
    starts.push(pos); words.push(w); text.appendChild(w); pos += tok.length;
  });
  row.appendChild(text);
  btn.onclick = () => {
    const same = cur && cur.btn === btn; clearCur(); stopAll(); if (same) return;
    cur = { btn, words }; btn.classList.add('on');
    if (b.a) {
      playSeg(Math.max(0, b.a[0] - 0.08), b.a[1] + 0.15, t => {
        words.forEach(w => w.classList.remove('on'));
        if (!b.w) return; let k = -1; b.w.forEach((tt, i) => { if (tt && tt[0] <= t + 0.02) k = i; });
        if (k >= 0 && words[k]) words[k].classList.add('on');
      }, () => { if (cur && cur.btn === btn) clearCur(); });
      return;
    }
    const say = b.v.replace(/^\(([A-D])\)\s*/, '');
    const off = b.v.length - say.length;
    speak(say, b.sp, ci => {
      words.forEach(w => w.classList.remove('on'));
      let i = 0; while (i + 1 < starts.length && starts[i + 1] <= ci + off) i++;
      if (words[i]) words[i].classList.add('on');
    }, () => { if (cur && cur.btn === btn) clearCur(); });
  };
  app.appendChild(row);
});

document.querySelectorAll('#rate button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#rate button').forEach(x => x.classList.toggle('on', x === b)); rate = +b.dataset.r;
});
document.querySelectorAll('#view button').forEach(b => b.onclick = () => {
  b.classList.toggle('on'); document.body.classList.toggle('hide-' + b.dataset.v, !b.classList.contains('on'));
});
</script>
</body>
