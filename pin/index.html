<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>핀번호 결제 · 메이크토익</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#1F3864;--orange:#F0562A;--ink:#101828;--text:#1F2937;--soft:#F3F5F9;--line:#E3E7EF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--soft);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}
.top a{color:var(--navy);text-decoration:none;font-weight:800}.top small{display:block;font-size:11px;letter-spacing:.1em;color:var(--orange)}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.hero{background:linear-gradient(125deg,#14264A,#1F3864);color:#fff;border:0}
.hero h1{margin:6px 0 6px;font-size:22px;letter-spacing:-.02em}.hero p{margin:0;font-size:14.5px;line-height:1.6;color:#fff}
.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;color:#FFB08F}
.price{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;color:var(--ink)}
.price b{font-size:22px;color:var(--orange)}
ul{margin:10px 0 0;padding-left:18px;font-size:14.5px;line-height:1.7;color:var(--ink)}
label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:12px 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;color:var(--ink)}
input:focus{outline:none;border-color:var(--navy)}
.note{font-size:13.5px;line-height:1.6;color:var(--ink);margin:10px 0 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-size:17px;font-weight:800;background:var(--orange);color:#fff;text-align:center;text-decoration:none;cursor:pointer}
.btn.navy{background:var(--navy)}.btn:disabled{opacity:.6}
.msg{border-radius:12px;padding:12px 14px;font-size:14.5px;font-weight:600;margin-top:10px}
.err{background:#FDECEC;color:#B42318}.ok{background:#E9F7EF;color:#05603A}
.terms{font-size:13px;line-height:1.7;color:var(--ink)}
.terms h3{font-size:14px;margin:12px 0 4px}
footer{max-width:560px;margin:0 auto;padding:8px 16px 40px;font-size:12.5px;line-height:1.7;color:#344054}
.pick{display:grid;gap:8px;margin-top:10px}.pk{display:flex;justify-content:space-between;align-items:center;border:2px solid #E3E7EF;background:#fff;border-radius:12px;padding:14px;font:inherit;font-size:16px;cursor:pointer;color:#101828}.pk b{font-size:16px}.pk span{font-weight:800}.pk.on{border-color:#F0562A;background:#FFF4EC}.pk.on span{color:#F0562A}.pick.s3{grid-template-columns:repeat(3,1fr)}.pick.s3 .pk{flex-direction:column;gap:2px;padding:12px 6px}.pick.s3 .pk span{font-size:12.5px;min-height:16px}
.reg{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;background:#F3F5F9;border-radius:12px;padding:12px 14px;font-size:16px;color:#101828}.reg em{white-space:nowrap;font-style:normal;font-size:12.5px;font-weight:800;color:#1E8E5A;background:#E3F4EB;border-radius:99px;padding:2px 8px;margin-left:4px}.reg button{white-space:nowrap;flex:none;border:1.5px solid #E3E7EF;background:#fff;border-radius:10px;padding:6px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:#101828}.ck{display:flex!important;align-items:center;gap:8px;margin-top:12px;font-size:15px;font-weight:700;color:#101828}.ck input{width:20px;height:20px;margin:0}.consent{margin-top:6px;font-size:13.5px;color:#101828}.consent summary{cursor:pointer;font-weight:700}.consent p{margin:6px 0 0;line-height:1.6}
.bk{text-align:center;font-weight:800;color:#101828;background:#FFF4EC;border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<header class="top"><a href="/"><small>MAKE TOEIC</small>메이크토익 수업 결제</a></header>
<main id="app"></main>
<footer>상호 메이크토익 | 대표 김정수 | 사업자등록번호 366-68-00555<br>주소 충청북도 청주시 청원구 대성로288번길 30 (우암동) 원빌라 2층<br>통신판매업 신고 제2021-충북청주-0930호 | 연락처 010-4845-1432</footer>
<script>
(function () {
var SUPA = "https://hrlldteviatcatxyzrrz.supabase.co", KEY = "sb_publishable_YT1A99HvH7VoMz76xq7Tvg__Imr0_qy";
var app = document.getElementById("app"), PIN = "", L = [], CUR = null, BOOK = true, MID = "";
function rpc(fn, a) { return fetch(SUPA + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(a) }).then(function (r) { return r.json(); }); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function won(n) { return Number(n).toLocaleString() + "원"; }
function amt(x, bk) { return x.people * (x.unit + (bk ? x.book : 0)); }
function realName(nm) {
  nm = String(nm || "").replace(/\s+/g, " ").trim();
  if (/[ㄱ-ㅎㅏ-ㅣ]/.test(nm) || /\d/.test(nm)) return false;
  var k = nm.replace(/ /g, "");
  if (/^[가-힣]{2,5}$/.test(k)) return !/^(.)\1+$/.test(k);
  return /^[A-Za-z][A-Za-z'.-]+( [A-Za-z][A-Za-z'.-]+)+$/.test(nm) && nm.length <= 40;
}
function pinForm(msg) {
  app.innerHTML = '<div class="card hero"><span class="kicker">MAKE TOEIC · 수업 결제</span><h1>핀번호 결제</h1><p>안내받은 핀번호를 넣으면 결제할 수 있는 상품이 나와요.</p></div>' +
    '<div class="card"><label for="pin">핀번호</label><input id="pin" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="숫자 4자리">' +
    '<button class="btn" id="go" style="margin-top:12px">확인</button>' + (msg || "") + '</div>';
  var i = document.getElementById("pin"), b = document.getElementById("go");
  i.focus(); i.onkeydown = function (e) { if (e.key === "Enter") b.click(); };
  b.onclick = function () {
    var p = i.value.replace(/\D/g, ""); if (!p) return;
    b.disabled = true; b.textContent = "확인 중…";
    rpc("pin_list", { p_pin: p }).then(function (r) {
      if (!Array.isArray(r) || !r.length) return pinForm('<div class="msg err">핀번호가 맞지 않아요. 다시 확인해 주세요.</div>');
      PIN = p; L = r; list();
    }).catch(function () { pinForm('<div class="msg err">잠시 후 다시 시도해 주세요.</div>'); });
  };
}
function list() {
  app.innerHTML = '<div class="card hero"><span class="kicker">MAKE TOEIC · 수업 결제</span><h1>결제할 상품을 고르세요</h1><p>교재비 28,000원(1인)은 포함 · 별도 중 고를 수 있어요.</p></div>' +
    '<div class="card"><div class="pick">' + L.map(function (x, k) {
      return '<button type="button" class="pk" data-k="' + k + '"><b style="text-align:left">' + esc(x.title) + '<small style="display:block;font-size:13px;font-weight:700;color:#344054;margin-top:3px">' + (x.people > 1 ? x.people + '명 × (' : '') + '수업 ' + won(x.unit) + ' + 교재 ' + won(x.book) + (x.people > 1 ? ')' : '') + '</small></b><span>' + won(amt(x, true)) + '</span></button>';
    }).join("") + '</div></div>';
  app.querySelectorAll("[data-k]").forEach(function (b) { b.onclick = function () { CUR = L[+b.dataset.k]; BOOK = true; detail(); window.scrollTo(0, 0); }; });
}
function detail(msg) {
  var x = CUR, a = amt(x, BOOK), keep = {};
  ["nm", "ph", "with"].forEach(function (id) { var e = document.getElementById(id); if (e) keep[id] = e.value; });
  var ag = document.getElementById("agree"); keep.ag = ag && ag.checked;
  app.innerHTML = '<div class="card"><button type="button" id="back" style="all:unset;cursor:pointer;font-size:14px;font-weight:800;color:#344054">‹ 상품 목록</button>' +
    '<div class="card hero" style="margin:10px 0 0"><span class="kicker">MAKE TOEIC · 핀번호 결제</span><h1>' + esc(x.title) + '</h1><p style="font-size:24px;font-weight:800;color:#FFB08F">' + won(a) + '</p></div>' +
    '<label>교재비 ' + won(x.book) + (x.people > 1 ? ' × ' + x.people + '명' : '') + '</label><div class="pick" style="grid-template-columns:1fr 1fr">' +
    '<button type="button" class="pk' + (BOOK ? ' on' : '') + '" data-b="1"><b>합산 결제</b></button><button type="button" class="pk' + (!BOOK ? ' on' : '') + '" data-b="0"><b>교재 별도</b></button></div>' +
    '<div class="price" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><span>' + (x.people > 1 ? x.people + '명 × ' : '') + '수업 ' + won(x.unit) + (BOOK ? ' + 교재 ' + won(x.book) : '') + '</span><b>' + won(a) + '</b></div>' +
    '<label for="nm">결제하는 사람 이름 (실명)</label><input id="nm" autocomplete="name" placeholder="예: 김민지">' +
    '<label for="ph">휴대폰 번호</label><input id="ph" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000">' +
    '<label for="with">동반 수강생 이름' + (x.people > 1 ? ' (필수)' : '') + '</label><input id="with" placeholder="' + (x.people > 2 ? '예: 이서연, 박준호' : '예: 이서연') + '">' +
    '<label class="ck" style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="agree" style="width:20px;height:20px"> 개인정보 수집 · 이용에 동의해요 (필수)</label>' +
    '<p class="note">수집 항목: 이름, 휴대폰 번호 · 이용 목적: 결제 확인 · 수업 안내 연락 · 보유 기간: 1년</p>' +
    '<button class="btn" id="card" style="margin-top:14px">💳 ' + won(a) + ' 카드결제</button>' +
    '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:15px;font-weight:800;color:var(--ink)">🏦 계좌이체로 결제하기</summary><p class="note">입금 계좌: <b>신한은행 612-06-541251 (김정수)</b><br>입금자명은 실명으로, 입금 후 문자로 알려 주세요.</p><button class="btn navy" id="sms" style="margin-top:8px">입금했어요 · 확인 문자 보내기</button></details>' +
    (BOOK ? '' : '<p class="note">교재비는 따로 결제해 주세요.</p>') +
    '<div style="background:#E9F8EE;border:2px solid #03C75A;border-radius:14px;padding:13px 14px;margin-top:12px"><b style="font-size:15px;color:#0B6B33;line-height:1.5">🎁 결제 후 당일 네이버 영수증리뷰 남겨주시면 5천원 환급 받으실 수 있습니다</b><p class="note" style="margin-top:4px">네이버 \'청주토익 메이크토익\' 검색 → 영수증리뷰 작성 후 <a href="sms:01048451432">인증샷 문자로 남겨주세요</a> (010-4845-1432)</p></div>' +
    '<p class="note">결제 후에는 환불되지 않아요 (결제 오류 · 중복 결제는 돌려 드려요)</p>' + (msg || "") + '</div>';
  ["nm", "ph", "with"].forEach(function (id) { if (keep[id]) document.getElementById(id).value = keep[id]; });
  if (keep.ag) document.getElementById("agree").checked = true;
  document.getElementById("back").onclick = list;
  app.querySelectorAll("[data-b]").forEach(function (b) { b.onclick = function () { BOOK = b.dataset.b === "1"; detail(); }; });
  function check() {
    var nm = document.getElementById("nm").value.trim(), ph = document.getElementById("ph").value.replace(/\D/g, ""), w = document.getElementById("with").value.trim();
    if (!realName(nm)) return "실명(주민등록상 이름)으로 적어 주세요.";
    if (!/^01\d{8,9}$/.test(ph)) return "휴대폰 번호를 확인해 주세요.";
    if (x.people > 1 && !w) return "동반 수강생 이름을 적어 주세요.";
    if (!document.getElementById("agree").checked) return "개인정보 수집 · 이용에 동의해 주세요.";
    return { nm: nm, ph: ph, w: w };
  }
  function err(t) { detail('<div class="msg err">' + esc(t) + '</div>'); }
  document.getElementById("sms").onclick = function () {
    var c = check(); if (typeof c === "string") return err(c);
    var body = "[메이크토익 핀번호 결제 · 입금 확인 요청]\n이름: " + c.nm + "\n상품: " + x.title + (BOOK ? " + 교재" : " (교재 별도)") + (c.w ? "\n동반: " + c.w : "") + "\n금액: " + won(a) + "\n신한은행 612-06-541251(김정수)로 입금했어요.";
    location.href = "sms:01048451432" + (/iPhone|iPad|iPod/.test(navigator.userAgent) ? "&" : "?") + "body=" + encodeURIComponent(body);
  };
  var cb = document.getElementById("card");
  cb.onclick = function () {
    var c = check(); if (typeof c === "string") return err(c);
    cb.disabled = true; cb.textContent = "결제창 여는 중…";
    rpc("pay_cfg", {}).then(function (cf) {
      MID = (cf || {}).mid || ""; if (!MID) throw new Error("카드결제를 준비 중이에요. 계좌이체로 결제해 주세요.");
      return rpc("pin_order", { p_pin: PIN, p_id: x.id, p_name: c.nm, p_phone: c.ph, p_book: BOOK, p_with: c.w });
    }).then(function (o) {
      if (!o || o.status !== "ok") throw new Error(o && o.status === "pin" ? "핀번호가 바뀌었어요. 처음부터 다시 해 주세요." : (o && o.message) || "결제를 시작하지 못했어요. 잠시 후 다시 시도해 주세요.");
      if (o.amount !== a) throw new Error("가격이 바뀌었어요. 화면을 새로 열어 주세요.");
      return loadInno().then(function () {
        cb.disabled = false; cb.textContent = "💳 " + won(a) + " 카드결제";
        innopay.goPay({ payMethod: "CARD", mid: MID, moid: o.order_id, goodsName: String(o.order_name).slice(0, 40), amt: o.amount, goodsCnt: 1,
          buyerName: c.nm, buyerTel: c.ph, buyerEmail: "js1432@naver.com", returnUrl: location.origin + "/pay/" });
      });
    }).catch(function (e) { err(e.message || String(e)); });
  };
}
function loadInno() {
  if (window.innopay) return Promise.resolve();
  return new Promise(function (ok, no) { var s = document.createElement("script"); s.src = "https://pg.innopay.co.kr/tpay/js/v1/innopay.js"; s.onload = ok; s.onerror = function () { no(new Error("결제창을 불러오지 못했어요. 새로고침해 주세요.")); }; document.head.appendChild(s); });
}
pinForm();
})();
</script>
</body>
</html>
