    : '<div class="card">' + (LC ? '<b style="color:var(--ink)">② 결제</b>' : '') + '<div id="pm"></div><div id="ag"></div></div>' +
    '<button class="btn" id="go">' + PRICE.toLocaleString() + '원 결제하기</button>')) +
    (FREEPDF() ? '<p class="note bk">※ 비회원 교재 PDF 무료 제공 · 실물 교재는 택배 착불 · 문의 요망 (' : '<p class="note bk">※ 온라인 수강 교재비는 별도 · 택배 배송 시 착불 · 문의 요망 (') + '<a href="https://open.kakao.com/o/su9VbJTi" target="_blank" rel="noopener">메이크토익 질문방</a> · 010-4845-1432)</p><p class="note" style="text-align:center"><b>' + (FREEPDF() ? '교재 PDF 무료 제공 · ' : '') + '입금 후 환불 불가.</b> 아래 환불 규정을 확인해 주세요.</p>' + (LC ? TERMS_LC : TERMS);
  var w, pmw;
  if (LC && !REG) { bindReg(); bindPick(); return; }
  if (BANK) { bindPick(); bindBank(); return; }
  try {
    w = PaymentWidget(CLIENT_KEY, PaymentWidget.ANONYMOUS);
    pmw = w.renderPaymentMethods("#pm", { value: PRICE });
    w.renderAgreement("#ag");
  } catch (e) { document.getElementById("pm").innerHTML = '<div class="msg err">결제창을 불러오지 못했어요. 새로고침해 주세요.</div>'; }
  var qt; function quote() {
    clearTimeout(qt); qt = setTimeout(function () {
      var nm = document.getElementById("nm").value.trim(), ph = document.getElementById("ph").value.replace(/\D/g, "");
      if (!LC || !nm || !/^01\d{8,9}$/.test(ph)) { if (MEM) { MEM = false; redraw(); } return; }
      rpc("pay_quote", { p_name: nm, p_phone: ph }).then(function (r) { var m = !!(r && r.member); if (m !== MEM) { MEM = m; redraw(); } }).catch(function () { });
    }, 400);
  }
  function redraw() { var nm = document.getElementById("nm").value, ph = document.getElementById("ph").value; PRICE = LC ? priceOf(KIND) : PRICE; form(); document.getElementById("nm").value = nm; document.getElementById("ph").value = ph; }
  if (document.getElementById("nm")) ["nm", "ph"].forEach(function (id) { document.getElementById(id).addEventListener("input", quote); });
  bindPick();
  var rr = document.getElementById("rereg"); if (rr) rr.onclick = function () { var r = REG; REG = null; try { sessionStorage.removeItem("mkreg"); } catch (e) { } form(); document.getElementById("nm").value = r.name; document.getElementById("ph").value = r.phone; };
  var b = document.getElementById("go");
  b.onclick = function () {
    var nm = LC && REG ? REG.name : v("nm").trim(), ph = LC && REG ? REG.phone : v("ph").replace(/\D/g, "");
    if (!nm) return form('<div class="msg err">이름을 적어 주세요.</div>');
    if (!realName(nm)) return form('<div class="msg err">' + NAME_ERR + '</div>');
    if (!/^01\d{8,9}$/.test(ph)) return form('<div class="msg err">휴대폰 번호를 정확히 적어 주세요.</div>');
    b.disabled = true; b.textContent = "결제창 여는 중…";
    rpc("pay_order", { p_name: nm, p_phone: ph, p_kind: KIND, p_season: LC ? SEA : null }).then(function (o) {
      if (o.status === "noprice") throw new Error("아직 판매 준비 중인 상품이에요. 다른 상품을 골라 주세요.");
      if (o.status !== "ok") throw new Error(o.status);
      try { sessionStorage.setItem("mkpay", JSON.stringify({ name: nm, last4: ph.slice(-4) })); } catch (e) { }
      if (o.amount !== PRICE) { PRICE = o.amount; try { pmw.updateAmount(PRICE); } catch (e) { } }
      return w.requestPayment({ orderId: o.order_id, orderName: o.order_name, customerName: nm, customerMobilePhone: ph,
        successUrl: location.origin + "/pay/?ok=1", failUrl: location.origin + "/pay/?fail=1" });
    }).catch(function (e) {
      b.disabled = false; b.textContent = PRICE.toLocaleString() + "원 결제하기";
      if (e && e.code === "USER_CANCEL") return;
      var m = document.createElement("div"); m.className = "msg err"; m.textContent = (e && e.message && e.message.length > 6) ? e.message : "결제를 시작하지 못했어요. 잠시 후 다시 시도해 주세요.";
      b.parentNode.insertBefore(m, b.nextSibling);
    });
  };
}
// 계좌이체 신청: 이름·번호·상품을 담아 선생님께 문자 (입금 계좌는 문자로 안내)
function bindBank() {
  var rr = document.getElementById("rereg"); if (rr) rr.onclick = function () { var r = REG; REG = null; try { sessionStorage.removeItem("mkreg"); } catch (e) { } form(); document.getElementById("nm").value = r.name; document.getElementById("ph").value = r.phone; };
  var cp = document.getElementById("bankcp"); if (cp) cp.onclick = function () { var t = "신한은행 61206541251"; function ok() { cp.textContent = "✔ 복사했어요 (신한 612-06-541251)"; } if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, function () { prompt("계좌번호", t); }); else prompt("계좌번호", t); };
  var b = document.getElementById("bank"); if (!b) return;
  b.onclick = function () {
    var nm = LC && REG ? REG.name : v("nm").trim(), ph = LC && REG ? REG.phone : v("ph").replace(/\D/g, "");
    if (!nm) return form('<div class="msg err">이름을 적어 주세요.</div>');
    if (!realName(nm)) return form('<div class="msg err">' + NAME_ERR + '</div>');
    if (!/^01\d{8,9}$/.test(ph)) return form('<div class="msg err">휴대폰 번호를 정확히 적어 주세요.</div>');
    var prod = (LC ? PRODS[KIND].name + (SEA ? " (Season " + SEA + ")" : "") : NAME) + (FREEPDF() ? " (교재 PDF 무료 포함)" : "");
    var body = "[메이크토익 계좌이체 입금 확인 요청]\n이름: " + nm + "\n번호: " + ph.replace(/^(\d{3})(\d+)(\d{4})$/, "$1-$2-$3") + "\n상품: " + prod + "\n금액: " + PRICE.toLocaleString() + "원\n신한은행 612-06-541251(김정수)로 입금했어요.";
    location.href = "sms:01048451432" + (/iPhone|iPad|iPod/.test(navigator.userAgent) ? "&" : "?") + "body=" + encodeURIComponent(body);
    var m = document.createElement("div"); m.className = "msg ok"; m.innerHTML = "문자 앱이 열리면 그대로 <b>보내기</b>를 눌러 주세요. 입금이 확인되면 학습실을 열어 드려요.<br>문자 앱이 안 열리면 010-4845-1432로 이름·상품을 보내 주세요.";
    b.parentNode.insertBefore(m, b.nextSibling);
  };
}
function bindPick() {
  app.querySelectorAll("[data-s]").forEach(function (x) { x.onclick = function () { keep(function () { SEA = +x.dataset.s; form(); }); }; });
  app.querySelectorAll("[data-k]").forEach(function (x) { x.onclick = function () { keep(function () { KIND = x.dataset.k; PRICE = priceOf(KIND); NAME = PRODS[KIND].name; history.replaceState(null, "", "/pay/?p=" + KIND); form(); }); }; });
}
function bindReg() {
  var b = document.getElementById("reg");
  b.onclick = function () {
    var nm = v("nm").trim(), ph = v("ph").replace(/\D/g, ""), ag = document.getElementById("agree").checked;
    function err(t) { keep(function () { form('<div class="msg err">' + t + '</div>'); }); }
    if (!nm) return err("이름을 적어 주세요.");
    if (!realName(nm)) return err(NAME_ERR);
    if (!/^01\d{8,9}$/.test(ph)) return err("휴대폰 번호를 정확히 적어 주세요.");
    if (!ag) return err("개인정보 수집 · 이용에 동의해 주세요.");
    b.disabled = true; b.textContent = "등록 중…";
    rpc("pay_register", { p_name: nm, p_phone: ph, p_kind: KIND, p_season: SEA, p_agree: true }).then(function (r) {
      if (!r || r.status !== "ok") throw new Error(r && r.status === "busy" ? "잠시 후 다시 시도해 주세요." : "등록하지 못했어요. 이름 · 번호를 확인해 주세요.");
      REG = { name: nm, phone: ph }; MEM = !!r.member; PRICE = priceOf(KIND);
      try { sessionStorage.setItem("mkreg", JSON.stringify(REG)); } catch (e) { }
      form(); window.scrollTo({ top: document.getElementById("pm").getBoundingClientRect().top + scrollY - 120, behavior: "smooth" });
    }).catch(function (e) { b.disabled = false; b.textContent = "등록하고 결제로 넘어가기"; err(e.message); });
  };
}
function done() {
  app.innerHTML = '<div class="card"><b>결제를 확인하는 중이에요…</b><p class="note">창을 닫지 말고 잠시만 기다려 주세요.</p></div>';
  rpc("pay_confirm", { p_order_id: q.get("orderId"), p_payment_key: q.get("paymentKey"), p_amount: +q.get("amount") }).then(function (r) {
    if (r.status !== "ok") throw new Error(r.message || "결제를 확인하지 못했어요.");
    var info = {}; try { info = JSON.parse(sessionStorage.getItem("mkpay") || "{}"); } catch (e) { }
    app.innerHTML = '<div class="card hero"><span class="kicker">결제 완료</span><h1>' + esc(r.name) + '님, 학습실이 열렸어요</h1><p>이용 기간: ' + esc(r.end_date) + '까지</p></div>' +
      '<div class="card"><p style="margin:0;font-size:15px;line-height:1.7;color:var(--ink)">학습실 입장: 이름 <b>' + esc(r.name) + '</b> + 휴대폰 뒤 4자리' + (info.last4 ? ' <b>' + esc(info.last4) + '</b>' : '') + '</p></div>' +
      '<a class="btn navy" href="/study/">학습실 입장하기</a>';
    history.replaceState(null, "", "/pay/?done=1");
  }).catch(function (e) {
    app.innerHTML = '<div class="card"><div class="msg err">' + esc(e.message) + '</div><p class="note">결제 금액이 빠져나갔는데 이 화면이 나오면 메이크토익 질문방이나 010-4845-1432로 알려 주세요.</p></div><a class="btn" href="/pay/">다시 결제하기</a>';
  });
}
function start() {
  if (q.get("ok") && q.get("paymentKey")) done();
  else if (q.get("fail")) form('<div class="msg err">' + esc(q.get("message") || "결제가 취소됐어요.") + '</div>');
  else form();
}
// 결제 키·가격은 서버(Supabase shop_cfg)에서 받아 온다 — 키를 바꿀 때 이 파일은 그대로
rpc("pay_cfg", {}).then(function (c) {
  if (!c || !c.ck) return; CFG = c; CLIENT_KEY = c.ck;
  ["lc", "rc", "lcrc"].forEach(function (k) { PRODS[k].price = c[k + "_price"] || (k === "lc" ? 24900 : 0); PRODS[k].priceM = c[k + "_price_m"] || 0; });
  if (BANK) { PRODS.lc.price = 30000; if (PRODS.lc.priceM > 30000) PRODS.lc.priceM = 0; }   // 계좌이체 기간: LC 30일 수강권 30,000원 (교재 PDF 무료)
  if (!LC) { PRICE = c.price || PRICE; }
}).catch(function () { }).then(function () {
  if (LC) { if (!(PRODS[KIND].price > 0)) KIND = "lc"; PRICE = PRODS[KIND].price; NAME = PRODS[KIND].name; if (!(SEA >= 1 && SEA <= 3)) SEA = CFG.cur || 2; }
  if (LC && REG && !q.get("ok")) return rpc("pay_quote", { p_name: REG.name, p_phone: REG.phone }).then(function (r) { MEM = !!(r && r.member); PRICE = priceOf(KIND); }).catch(function () { }).then(start);
  start();
});
})();
</script>
